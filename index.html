<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premiere Pro Web Studio - المصمم طارق ابراهيم</title>
    <!-- استيراد الخطوط العربية والإنجليزية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Amiri:wght@700&family=Tajawal:wght@700&family=El+Messiri:wght@700&family=Changa:wght@700&family=Roboto:wght@700&family=Montserrat:wght@700&family=Lobster&family=Oswald:wght@700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #cccccc; font-family: Tahoma, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 11px; user-select: none; }
        
        .top-menu { background: #1e1e1e; height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2d2d2d; }
        .top-menu .menu-items { display: flex; gap: 15px; color: #aaa; align-items: center; }
        
        /* زر الحفظ النهائي البارز */
        .btn-export { background: #008751; color: #fff; font-weight: bold; padding: 6px 14px; border-radius: 4px; border: 1px solid #00aa63; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        .btn-export:hover { background: #00aa63; }

        .workspace { display: grid; grid-template-columns: 280px 1fr 300px; grid-template-rows: 1fr 240px; flex: 1; gap: 1px; background: #2d2d2d; overflow: hidden; }
        .panel { background: #1b1b1b; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .panel-header { background: #252525; height: 26px; display: flex; align-items: center; padding: 0 8px; font-weight: bold; border-bottom: 1px solid #333; color: #ddd; gap: 8px; }
        
        .project-content { padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-content: flex-start; overflow-y: auto; flex: 1; }
        .media-thumb { width: 75px; background: #262626; border: 1px solid #333; padding: 4px; text-align: center; cursor: pointer; border-radius: 3px; }
        .media-thumb span { display: block; font-size: 9px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }

        /* شاشة المعاينة المتكيفة مع أبعاد الفيديو */
        .monitor-pane { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #080808; flex: 1; position: relative; overflow: hidden; }
        .canvas-container { position: relative; display: flex; align-items: center; justify-content: center; max-height: 100%; max-width: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        video#mainPlayer { display: block; max-height: calc(100vh - 320px); width: auto; height: auto; object-fit: contain; }
        
        /* عناصر الـ Overlay المتحركة داخل الفيديو */
        .movable-overlay { position: absolute; cursor: move; border: 1px dashed transparent; display: flex; align-items: center; justify-content: center; }
        .movable-overlay:hover { border-color: #007acc; }
        
        .monitor-controls { height: 36px; background: #1e1e1e; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border-top: 1px solid #2d2d2d; }
        
        .timeline-pane { grid-column: 1 / 3; background: #181818; display: flex; flex-direction: column; border-top: 1px solid #2d2d2d; }
        .timeline-toolbar { height: 32px; background: #222; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-bottom: 1px solid #333; }
        .timeline-tracks { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: #151515; }
        
        .track-row { height: 36px; background: #1f1f1f; border-bottom: 1px solid #282828; display: flex; align-items: center; position: relative; }
        .track-label { width: 60px; background: #252525; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border-left: 2px solid #007acc; font-weight: bold; font-size: 10px; color: #fff; cursor: pointer; }
        .track-label.active { background: #007acc; }
        .track-lane { flex: 1; height: 30px; position: relative; margin: 0 4px; background: #111; border-radius: 2px; }
        
        .clip-item { position: absolute; height: 26px; top: 2px; background: #1c3d5a; border: 1px solid #3178c6; border-radius: 3px; display: flex; align-items: center; padding: 0 6px; font-size: 10px; color: #fff; cursor: pointer; overflow: hidden; white-space: nowrap; }

        button { background: #333; color: #fff; border: 1px solid #444; padding: 3px 8px; border-radius: 2px; cursor: pointer; font-size: 11px; }
        button:hover { background: #444; }
        
        .effects-content { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
        .effect-group { background: #222; padding: 6px 8px; border-radius: 3px; border: 1px solid #333; }
        .effect-group label { display: block; margin-bottom: 3px; color: #aaa; }
        input[type="range"], select, input[type="text"], input[type="color"] { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 2px; }
        input[type="color"] { height: 26px; padding: 0; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-menu">
        <div class="menu-items">
            <span style="color: #007acc; font-weight: bold; font-size: 13px;">Premiere Pro Studio</span>
            <span>File</span><span>Edit</span><span>Sequence</span><span>Window</span>
        </div>
        <div>
            <button class="btn-export" onclick="exportFinalVideo()">💾 الحفظ النهائي والتصدير</button>
        </div>
    </div>

    <div class="workspace">
        <!-- 1. لوحة المشروع والاستيراد -->
        <div class="panel">
            <div class="panel-header">
                <span>Project Bin</span>
                <button onclick="document.getElementById('fileInput').click()" style="margin-right: auto; font-size: 10px;">+ استيراد فيديو/صورة</button>
                <input type="file" id="fileInput" accept="video/*,image/*" multiple style="display: none;">
            </div>
            <div class="project-content" id="projectBin">
                <div style="color: #666; font-size: 10px; text-align: center; width: 100%; margin-top: 20px;">قم برفع الفيديو الرئيسي أو الشعار</div>
            </div>
        </div>

        <!-- 2. شاشة المعاينة المتكيفة مع الفيديو -->
        <div class="panel">
            <div class="panel-header">
                <span>Program Monitor (متكيف مع أبعاد الفيديو)</span>
                <span id="timecodeDisplay" style="margin-right: auto; color: #3178c6; font-family: monospace;">00:00:00:00</span>
            </div>
            <div class="monitor-pane">
                <div class="canvas-container" id="canvasContainer">
                    <video id="mainPlayer" playsinline></video>
                    <!-- عناصر التراكب المتحركة -->
                    <div id="textOverlay" class="movable-overlay" style="display:none; color:#fff; font-size:24px; text-shadow:2px 2px 4px #000; top:20px; left:20px;">النص هنا</div>
                    <div id="logoOverlay" class="movable-overlay" style="display:none; top:20px; right:20px;"><img id="logoImg" style="max-height:80px; pointer-events:none;"></div>
                    <div id="blurOverlay" class="movable-overlay" style="display:none; backdrop-filter:blur(8px); background:rgba(255,255,255,0.1); width:120px; height:80px; border-radius:4px; top:100px; left:100px;"></div>
                </div>
                <div id="placeholderText" style="color: #555; position: absolute;">لم يتم تحميل فيديو رئيسي بعد</div>
            </div>
            <div class="monitor-controls">
                <button onclick="stepFrame(-1)">◀ 1-</button>
                <button id="playPauseBtn" onclick="togglePlayPlayback()" style="background: #007acc; font-weight: bold;">تشغيل / إيقاف</button>
                <button onclick="stepFrame(1)">1+ ▶</button>
                <button onclick="splitCurrentClip()" style="background: #5a331c;">✂ تقطيع Clip</button>
            </div>
        </div>

        <!-- 3. لوحة التأثيرات المتقدمة والخطوط والتغشية -->
        <div class="panel" style="grid-row: span 2;">
            <div class="panel-header">Effects Controls & Customization</div>
            <div class="effects-content">
                <div class="effect-group">
                    <label>التحكم بالنصوص:</label>
                    <input type="text" id="customTextInput" placeholder="اكتب النص هنا...">
                    <div style="display:flex; gap:5px; margin-top:4px;">
                        <select id="fontFamilySelect">
                            <optgroup label="خطوط عربية">
                                <option value="Cairo">Cairo (كايرو)</option>
                                <option value="Amiri">Amiri (أميري)</option>
                                <option value="Tajawal">Tajawal (تجوال)</option>
                                <option value="El Messiri">El Messiri (المسيري)</option>
                                <option value="Changa">Changa (شنجا)</option>
                            </optgroup>
                            <optgroup label="خطوط إنجليزية">
                                <option value="Roboto">Roboto</option>
                                <option value="Montserrat">Montserrat</option>
                                <option value="Lobster">Lobster</option>
                                <option value="Oswald">Oswald</option>
                                <option value="Courier Prime">Courier Prime</option>
                            </optgroup>
                        </select>
                        <input type="color" id="textColorPicker" value="#ffffff" style="width: 40px;" title="لون النص">
                    </div>
                    <label style="margin-top:4px;">الحجم (<span id="fontSizeVal">24</span>px)</label>
                    <input type="range" id="fontSizeRange" min="14" max="100" value="24">
                </div>

                <div class="effect-group">
                    <label>إضافة شعار / لوغو أو صورة:</label>
                    <button onclick="document.getElementById('logoInput').click()" style="width:100%; background:#264d73;">+ استيراد لوغو أو صورة</button>
                    <input type="file" id="logoInput" accept="image/*" style="display: none;">
                </div>

                <div class="effect-group">
                    <label>فلتر التغشية (Blur Overlay):</label>
                    <div style="display:flex; gap:5px;">
                        <button onclick="toggleBlur('rect')" style="flex:1;">مستطيل بلور</button>
                        <button onclick="toggleBlur('circle')" style="flex:1;">دائرة بلور</button>
                        <button onclick="removeBlur()" style="background:#5a1c1c;">إلغاء</button>
                    </div>
                </div>

                <div class="effect-group">
                    <label>السطوع (<span id="brightVal">100</span>%)</label>
                    <input type="range" id="brightnessRange" min="0" max="200" value="100">
                </div>
                <div class="effect-group">
                    <label>الشفافية (<span id="opacityVal">100</span>%)</label>
                    <input type="range" id="opacityRange" min="0" max="100" value="100">
                </div>
            </div>
        </div>

        <!-- 4. التايملاين -->
        <div class="timeline-pane">
            <div class="timeline-toolbar">
                <span style="color: #fff; font-weight: bold;">Timeline: Sequence 01</span>
                <button onclick="clearTimeline()" style="background: #5a1c1c; font-size: 10px; margin-right: auto;">تفريغ التايملاين</button>
            </div>
            <div class="timeline-tracks">
                <div class="track-row"><div class="track-label">V3</div><div class="track-lane"></div></div>
                <div class="track-row"><div class="track-label">V2</div><div class="track-lane"></div></div>
                <div class="track-row"><div class="track-label active">V1</div><div class="track-lane" id="laneV1"></div></div>
                <div class="track-row" style="height: 30px;"><div class="track-label" style="border-left-color: #2e8b57;">A1</div><div class="track-lane"></div></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
