<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الفيديو السحابي الاحترافي - (V1 & V2)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #1e1e1e; color: #f3f4f6; font-family: Tahoma, sans-serif; user-select: none; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #252526; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 10; }
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        .preview-pane { flex: 1; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-right: 1px solid #333; }
        .sidebar { width: 320px; background: #252526; padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; border-left: 1px solid #333; font-size: 14px; }
        .timeline { height: 210px; background: #1e1e1e; border-top: 1px solid #333; display: flex; flex-direction: column; }
        .timeline-header { height: 36px; background: #2d2d2d; border-bottom: 1px solid #444; display: flex; align-items: center; padding: 0 16px; font-size: 12px; color: #9ca3af; justify-content: space-between; }
        .track { background: #2d2d2d; border-bottom: 1px solid #404040; height: 42px; display: flex; align-items: center; padding: 0 8px; border-radius: 4px; margin: 4px; }
        button { background: #333; color: #fff; border: 1px solid #555; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        button:hover { background: #444; }
        input[type="range"] { accent-color: #f59e0b; cursor: pointer; width: 100%; }
        select, input[type="text"] { background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; width: 100%; font-size: 13px; }
        .track-content { flex: 1; height: 30px; border-radius: 4px; margin-right: 8px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 11px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-v1 { background: #1e3a8a; border: 1px solid rgba(59, 130, 246, 0.5); }
        .track-v2 { background: #831843; border: 1px solid rgba(236, 72, 153, 0.5); }
    </style>
</head>
<body>

    <!-- شريط القوائم العلوي -->
    <header>
        <div style="display: flex; gap: 12px; align-items: center;">
            <span style="font-weight: bold; color: #f59e0b; font-size: 16px;">🎬 محرر الفيديو السحابي</span>
            <button onclick="document.getElementById('fileInputV1').click()" style="background: #1e3a8a; border-color: #3b82f6;">📁 استيراد V1</button>
            <input type="file" id="fileInputV1" accept="video/*,image/*" style="display: none;">
            
            <button onclick="document.getElementById('fileInputV2').click()" style="background: #831843; border-color: #ec4899;">📁 استيراد V2 (فوق V1)</button>
            <input type="file" id="fileInputV2" accept="video/*,image/*" style="display: none;">
        </div>
        <div style="font-size: 12px; color: #9ca3af;">المصمم طارق ابراهيم</div>
    </header>

    <!-- منطقة العمل الرئيسية -->
    <div class="main-container">
        
        <!-- شاشة المعاينة المباشرة -->
        <div id="dropZone" class="preview-pane">
            <div style="position: absolute; top: 8px; right: 8px; font-size: 11px; color: #9ca3af; background: rgba(30,30,30,0.8); padding: 4px 8px; border-radius: 4px; z-index: 10;">شاشة المعاينة</div>
            
            <div style="position: relative; max-height: 100%; max-width: 100%; display: flex; align-items: center; justify-content: center; padding: 16px;">
                <!-- مشغلات الفيديو السحابية -->
                <video id="playerV1" style="max-height: 58vh; max-width: 100%; display: none; border-radius: 6px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);" playsinline controls></video>
                <video id="playerV2" style="max-height: 58vh; max-width: 100%; display: none; position: absolute; border-radius: 6px;" playsinline></video>
            </div>

            <div id="dragHint" style="position: absolute; color: #6b7280; font-size: 14px; pointer-events: none; text-align: center; padding: 16px;">
                اسحب وأفلت الملفات هنا، أو استخدم أزرار الاستيراد في الأعلى
            </div>
        </div>

        <!-- لوحة التحكم بالخصائص -->
        <div class="sidebar">
            <h3 style="font-weight: bold; border-bottom: 1px solid #444; padding-bottom: 8px; color: #fbbf24;">الخصائص والتأثيرات</h3>
            
            <div>
                <label style="font-size: 12px; color: #9ca3af; display: block; margin-bottom: 4px;">السطوع العام (<span id="brightVal">100</span>%)</label>
                <input type="range" id="brightnessRange" min="0" max="200" value="100">
            </div>

            <div>
                <label style="font-size: 12px; color: #9ca3af; display: block; margin-bottom: 4px;">الشفافية العامة (<span id="opacityVal">100</span>%)</label>
                <input type="range" id="opacityRange" min="0" max="100" value="100">
            </div>
        </div>
    </div>

    <!-- التايم لاين -->
    <div class="timeline">
        <div class="timeline-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span id="timecode">التوقيت: 00:00:00</span>
                <div style="display: flex; gap: 4px;">
                    <button onclick="stepVideo(-0.04)" title="تأخير إطار">◀ 1-</button>
                    <button id="playPauseBtn" onclick="togglePlayPause()" style="background: #d97706; font-weight: bold;">تشغيل</button>
                    <button onclick="stepVideo(0.04)" title="تقديم إطار">1+ ▶</button>
                </div>
            </div>
            <div>
                <button onclick="clearAllTracks()" style="background: #7f1d1d;">🗑 تفريغ التايم لاين</button>
            </div>
        </div>

        <div style="flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 2px;">
            <div class="track">
                <span style="width: 32px; font-weight: bold; color: #ec4899; font-size: 12px;">V2</span>
                <div id="trackV2" class="track-content track-v2">
                    <span>لم يتم إدراج ملف في V2...</span>
                </div>
            </div>
            <div class="track">
                <span style="width: 32px; font-weight: bold; color: #3b82f6; font-size: 12px;">V1</span>
                <div id="trackV1" class="track-content track-v1">
                    <span>لم يتم إدراج ملف في V1...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
