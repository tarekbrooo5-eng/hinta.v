<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premiere Studio - Tarek Ibrahim</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1a1a; --panel:#232323; --panel-head:#2b2b2b; --panel-head-active:#333;
  --border:#0d0d0d; --line:#333; --text:#c9c9c9; --dim:#888;
  --accent:#4a9eff; --accent-hover:#6bb0ff;
  --video-clip:#3d6b9a; --video-clip-border:#5a8bc0;
  --audio-clip:#3d6b4a; --audio-clip-border:#5a8b6a;
  --selected:#ffcc00; --playhead:#4a9eff;
  --th-bg:#262626; --lane:#1e1e1e; --lane-alt:#202020;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI','Cairo',Tahoma,sans-serif;font-size:11px;user-select:none}

.app{display:grid;grid-template-rows:26px 1fr 250px;width:100vw;height:100vh;gap:1px;background:var(--border)}

/* ====== Menu Bar ====== */
.menubar{background:#181818;display:flex;align-items:center;padding:0 8px;gap:14px;font-size:11px;color:#b8b8b8}
.menubar .logo{background:#4a9eff;color:#0a0a0a;font-weight:800;padding:2px 7px;border-radius:3px;font-size:12px}
.menubar .menu{padding:3px 7px;border-radius:3px;cursor:pointer}
.menubar .menu:hover{background:#2a2a2a;color:#fff}
.menubar .spacer{flex:1}
.menubar .ws-title{color:#888;font-size:10px;letter-spacing:.5px}

/* ====== Middle panels ====== */
.middle{display:grid;grid-template-columns:250px 1fr 1fr 250px;gap:1px;background:var(--border);overflow:hidden}

.panel{display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
.panel-header{height:26px;background:var(--panel-head);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:600;color:#ddd;gap:6px}
.panel-header .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.panel-body{flex:1;overflow:auto;position:relative}

/* Project Panel */
.proj-toolbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:#212121;border-bottom:1px solid var(--border)}
.icon-btn{background:transparent;border:1px solid transparent;color:#b8b8b8;padding:3px 7px;border-radius:3px;
  cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px}
.icon-btn:hover{background:#2e2e2e;color:#fff;border-color:#3a3a3a}
.icon-btn.primary{background:var(--accent);color:#fff;border-color:#2b7de9;font-size:11px;padding:4px 10px}
.icon-btn.primary:hover{background:var(--accent-hover)}
.proj-cols{display:grid;grid-template-columns:1fr 70px;gap:8px;padding:5px 10px;background:#1c1c1c;
  border-bottom:1px solid var(--border);color:#777;font-size:10px;font-weight:600;text-transform:uppercase}
.proj-list{overflow-y:auto;height:100%}
.proj-item{display:grid;grid-template-columns:26px 1fr 70px;gap:8px;padding:5px 8px;align-items:center;
  cursor:pointer;border-bottom:1px solid #1c1c1c}
.proj-item:hover{background:#2a2a2a}
.proj-item.selected{background:#2b4a75}
.proj-thumb{width:26px;height:18px;background:#111;border:1px solid #333;border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:9px;color:#777;overflow:hidden}
.proj-thumb img{width:100%;height:100%;object-fit:cover}
.proj-name{font-size:11px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-dur{font-size:10px;color:#888;text-align:right}

/* Monitors */
.monitor-wrap{display:flex;flex-direction:column;flex:1;background:#0f0f0f;overflow:hidden}
.monitor-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.monitor-canvas-wrap canvas{max-width:100%;max-height:100%;background:#000;border:1px solid #111;box-shadow:0 0 12px rgba(0,0,0,.9)}
.monitor-ctrl{height:36px;background:var(--panel-head);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}
.monitor-ctrl button{background:transparent;border:none;color:#c9c9c9;cursor:pointer;padding:4px 6px;border-radius:3px;font-size:12px}
.monitor-ctrl button:hover{background:#3a3a3a;color:#fff}
.tc-display{font-family:'Consolas',monospace;font-size:11px;color:#4a9eff;letter-spacing:.5px}

/* Effect Controls */
.eff-list{display:flex;flex-direction:column}
.eff-item{background:#1c1c1c;border-bottom:1px solid #111}
.eff-title{padding:6px 10px;background:#242424;color:#ddd;font-weight:600;font-size:11px;
  display:flex;align-items:center;gap:6px;cursor:pointer}
.eff-title .arrow{color:#777;font-size:9px}
.eff-ctrl{padding:7px 10px;display:flex;flex-direction:column;gap:6px}
.eff-row{display:flex;align-items:center;gap:6px}
.eff-row label{color:#aaa;font-size:10px;min-width:60px}
.eff-row input[type=range]{flex:1;accent-color:var(--accent);height:3px}
.eff-row .val{font-family:'Consolas',monospace;color:#4a9eff;font-size:10px;min-width:40px;text-align:right}
.eff-row input[type=color]{width:28px;height:20px;border:1px solid #444;background:#111;border-radius:3px;padding:0}
.eff-row input[type=checkbox]{accent-color:var(--accent)}

/* ====== Timeline ====== */
.timeline{display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
.tl-header{height:28px;background:var(--panel-head);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:8px}
.seq-tab{background:#1e1e1e;border:1px solid #333;border-top:2px solid var(--accent);
  padding:4px 12px;border-radius:3px 3px 0 0;color:#ddd;font-size:11px;font-weight:600}
.tl-tools{display:flex;gap:2px;margin-left:10px}
.tool-btn{background:transparent;border:1px solid transparent;color:#999;padding:3px 7px;border-radius:3px;cursor:pointer;font-size:12px}
.tool-btn:hover{background:#2e2e2e;color:#fff}
.tool-btn.active{background:#2b4a75;color:#fff;border-color:var(--accent)}
.tl-zoom{margin-left:auto;display:flex;align-items:center;gap:6px;color:#888;font-size:10px}
.tl-zoom input{width:120px;accent-color:var(--accent)}

.tl-body{flex:1;display:grid;grid-template-columns:170px 1fr;overflow:hidden}

/* Track Headers */
.th-col{background:#1c1c1c;border-right:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.th-spacer{height:26px;background:#181818;border-bottom:1px solid var(--border)}
.th{display:flex;align-items:center;padding:0 8px;gap:4px;border-bottom:1px solid #111}
.th.video{background:#222629}
.th.audio{background:#212a23}
.th .name{font-weight:700;color:#ddd;font-size:11px;min-width:26px}
.th .spacer{flex:1}
.th .mini-btn{width:16px;height:16px;background:transparent;border:1px solid transparent;border-radius:2px;
  color:#777;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.th .mini-btn:hover{background:#333;color:#fff}
.th .mini-btn.on{color:#4a9eff;background:#1c2a3d}
.th .mini-btn.mute-on{color:#ff5a5a;background:#3a1c1c}

/* Track Lanes */
.lanes-col{position:relative;overflow:auto;background:#181818}
.ruler{height:26px;background:#1c1c1c;border-bottom:1px solid var(--border);position:relative;
  min-width:3000px;cursor:pointer;overflow:hidden}
.ruler .tick{position:absolute;top:0;height:100%;border-left:1px solid #2a2a2a;color:#888;font-size:9px;
  font-family:'Consolas',monospace;padding:3px 0 0 4px;pointer-events:none}
.ruler .tick.major{border-left-color:#4a4a4a;color:#c9c9c9}
.tracks{position:relative;min-width:3000px}
.lane{height:50px;border-bottom:1px solid #111;position:relative;background:var(--lane)}
.lane.audio{background:var(--lane-alt)}
.lane.locked{opacity:.6}

.clip{position:absolute;top:4px;height:42px;border-radius:3px;overflow:hidden;cursor:pointer;
  border:1px solid transparent;display:flex;flex-direction:column;font-size:10px;color:#eaeaea}
.clip.video{background:var(--video-clip);border-color:var(--video-clip-border)}
.clip.audio{background:var(--audio-clip);border-color:var(--audio-clip-border);height:36px;top:7px}
.clip.selected{box-shadow:0 0 0 2px var(--selected);z-index:5}
.clip .clip-name{background:rgba(0,0,0,.35);padding:2px 6px;font-weight:600;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;font-size:10px}
.clip .waveform{flex:1;background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.08) 50%,transparent 100%);
  background-size:4px 100%;background-repeat:repeat-x}
.clip .frames{flex:1;background-image:repeating-linear-gradient(90deg,transparent 0,transparent 44px,rgba(0,0,0,.3) 44px,rgba(0,0,0,.3) 45px)}

/* Playhead */
.playhead{position:absolute;top:0;width:2px;background:var(--playhead);pointer-events:none;z-index:20;
  box-shadow:0 0 4px rgba(74,158,255,.6)}
.playhead::before{content:'';position:absolute;top:0;left:-5px;width:12px;height:12px;
  background:var(--playhead);clip-path:polygon(0 0,100% 0,50% 100%);pointer-events:auto;cursor:ew-resize}

/* Context/Selection highlight on ruler */
.ruler-sel{position:absolute;top:0;height:100%;background:rgba(74,158,255,.08);border-left:1px solid #4a9eff;border-right:1px solid #4a9eff;pointer-events:none}

/* Scroll */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#1a1a1a}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#4a4a4a}

.hidden{display:none!important}
</style>
</head>
<body>

<div class="app">

  <!-- ============ MENU BAR ============ -->
  <div class="menubar">
    <div class="logo">Pr</div>
    <div class="menu">File</div>
    <div class="menu">Edit</div>
    <div class="menu">Clip</div>
    <div class="menu">Sequence</div>
    <div class="menu">Marker</div>
    <div class="menu">Window</div>
    <div class="menu">Help</div>
    <div class="spacer"></div>
    <div class="ws-title">EDITING WORKSPACE</div>
  </div>

  <!-- ============ MIDDLE PANELS ============ -->
  <div class="middle">

    <!-- Project Panel -->
    <div class="panel">
      <div class="panel-header"><span class="dot"></span>Project: Tarek_Studio.prproj</div>
      <div class="proj-toolbar">
        <button class="icon-btn primary" id="importBtn">⬆ Import</button>
        <button class="icon-btn" id="newBinBtn" title="New Bin">🗀</button>
        <button class="icon-btn" id="deleteBtn" title="Delete">🗑</button>
        <button class="icon-btn" id="addToTLBtn" title="Add to Timeline" style="margin-left:auto">＋</button>
      </div>
      <div class="proj-cols">
        <div>Name</div>
        <div>Duration</div>
      </div>
      <div class="proj-list" id="projList"></div>
      <input type="file" id="fileInput" accept="video/*,image/*,audio/*" multiple hidden>
    </div>

    <!-- Source Monitor -->
    <div class="panel">
      <div class="panel-header"><span class="dot" style="background:#888"></span>Source: <span id="sourceTitle" style="color:#888;font-weight:400">no clip selected</span></div>
      <div class="monitor-wrap">
        <div class="monitor-canvas-wrap"><canvas id="sourceCanvas" width="640" height="360"></canvas></div>
        <div class="monitor-ctrl">
          <button>⏮</button><button>◀◀</button>
          <button id="srcPlay">▶</button>
          <button>▶▶</button><button>⏭</button>
          <span class="tc-display" id="srcTC" style="margin-left:10px">00:00:00:00</span>
        </div>
      </div>
    </div>

    <!-- Program Monitor -->
    <div class="panel">
      <div class="panel-header"><span class="dot"></span>Program: Sequence 01</div>
      <div class="monitor-wrap">
        <div class="monitor-canvas-wrap"><canvas id="programCanvas" width="640" height="360"></canvas></div>
        <div class="monitor-ctrl">
          <button>⏮</button><button>◀◀</button>
          <button id="progPlay">▶</button>
          <button>▶▶</button><button>⏭</button>
          <span class="tc-display" id="progTC" style="margin-left:10px">00:00:00:00</span>
        </div>
      </div>
    </div>

    <!-- Effect Controls -->
    <div class="panel">
      <div class="panel-header"><span class="dot" style="background:#888"></span>Effect Controls</div>
      <div class="panel-body">
        <div class="eff-list">
          <div class="eff-item">
            <div class="eff-title"><span class="arrow">▼</span>Opacity</div>
            <div class="eff-ctrl">
              <div class="eff-row"><label>Opacity</label>
                <input type="range" id="effOpacity" min="0" max="100" value="100">
                <span class="val" id="effOpacityVal">100%</span></div>
            </div>
          </div>
          <div class="eff-item">
            <div class="eff-title"><span class="arrow">▼</span>Lumetri Color</div>
            <div class="eff-ctrl">
              <div class="eff-row"><label>Brightness</label>
                <input type="range" id="effBright" min="0" max="200" value="100">
                <span class="val" id="effBrightVal">100</span></div>
              <div class="eff-row"><label>Contrast</label>
                <input type="range" id="effContrast" min="0" max="200" value="100">
                <span class="val" id="effContrastVal">100</span></div>
              <div class="eff-row"><label>Saturation</label>
                <input type="range" id="effSat" min="0" max="200" value="100">
                <span class="val" id="effSatVal">100</span></div>
            </div>
          </div>
          <div class="eff-item">
            <div class="eff-title"><span class="arrow">▼</span>Ultra Key (Chroma)</div>
            <div class="eff-ctrl">
              <div class="eff-row">
                <label>Enable</label>
                <input type="checkbox" id="chromaToggle">
              </div>
              <div class="eff-row"><label>Key Color</label>
                <input type="color" id="chromaColorPicker" value="#00ff00">
                <span class="val" style="color:#888">pick</span></div>
              <div class="eff-row"><label>Tolerance</label>
                <input type="range" id="chromaTolRange" min="10" max="150" value="40">
                <span class="val" id="chromaTolVal">40</span></div>
            </div>
          </div>
          <div class="eff-item">
            <div class="eff-title"><span class="arrow">▼</span>Logo Overlay</div>
            <div class="eff-ctrl">
              <div class="eff-row">
                <button class="icon-btn" id="logoBtn" style="width:100%;justify-content:center;background:#2b4a75;color:#fff">📁 Load Logo</button>
                <input type="file" id="logoInput" accept="image/*" hidden>
              </div>
              <div class="eff-row"><label>Size</label>
                <input type="range" id="logoSizeRange" min="30" max="300" value="100">
                <span class="val" id="logoSizeVal">100</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ============ TIMELINE ============ -->
  <div class="timeline">
    <div class="tl-header">
      <div class="seq-tab">Sequence 01</div>
      <div class="tl-tools">
        <button class="tool-btn active" data-tool="select" title="Selection (V)">➤</button>
        <button class="tool-btn" data-tool="razor" title="Razor (C)">✂</button>
        <button class="tool-btn" data-tool="hand" title="Hand (H)">✋</button>
      </div>
      <div class="tl-zoom">
        <span>Zoom</span>
        <input type="range" id="zoomRange" min="15" max="200" value="60">
      </div>
    </div>
    <div class="tl-body">
      <div class="th-col" id="thCol">
        <div class="th-spacer"></div>
      </div>
      <div class="lanes-col" id="lanesCol">
        <div class="ruler" id="ruler"></div>
        <div class="tracks" id="tracks"></div>
        <div class="playhead" id="playhead" style="left:0"></div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
