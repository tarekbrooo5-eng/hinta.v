<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premiere Studio v2.0 - Tarek Ibrahim</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&family=El+Messiri:wght@400;700&family=Changa:wght@400;700;800&family=Amiri:wght@400;700&family=Almarai:wght@400;700;800&family=Roboto:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Poppins:wght@400;700;900&family=Oswald:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1a1a;--panel:#232323;--panel-head:#2b2b2b;--border:#0d0d0d;--text:#c9c9c9;
--accent:#4a9eff;--accent-hover:#6bb0ff;
--video-clip:#3d6b9a;--audio-clip:#3d6b4a;--text-clip:#8a4a9a;--logo-clip:#b06a1a;
--selected:#ffcc00;--playhead:#4a9eff;--lane:#1e1e1e;--lane-alt:#202020;--target:#ff9500}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);
font-family:'Segoe UI','Cairo',Tahoma,sans-serif;font-size:11px;user-select:none}
.app{display:grid;grid-template-rows:26px 1fr 340px;width:100vw;height:100vh;gap:1px;background:var(--border)}
.menubar{background:#181818;display:flex;align-items:center;padding:0 8px;gap:14px;font-size:11px;color:#b8b8b8}
.menubar .logo{background:#4a9eff;color:#0a0a0a;font-weight:800;padding:2px 7px;border-radius:3px}
.menubar .menu{padding:3px 7px;border-radius:3px;cursor:pointer}.menubar .menu:hover{background:#2a2a2a;color:#fff}
.menubar .spacer{flex:1}.menubar .status{color:#4a9eff;font-size:10px;font-family:Consolas,monospace}
.middle{display:grid;grid-template-columns:250px 1fr 1fr 260px;gap:1px;background:var(--border);overflow:hidden}
.panel{display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
.panel-header{height:26px;background:var(--panel-head);border-bottom:1px solid var(--border);
display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:600;color:#ddd;gap:6px}
.panel-header .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.panel-body{flex:1;overflow:auto;position:relative}
.proj-toolbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:#212121;border-bottom:1px solid var(--border);flex-wrap:wrap}
.icon-btn{background:transparent;border:1px solid transparent;color:#b8b8b8;padding:3px 7px;border-radius:3px;
cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px}
.icon-btn:hover{background:#2e2e2e;color:#fff;border-color:#3a3a3a}
.icon-btn.primary{background:var(--accent);color:#fff;border-color:#2b7de9;font-size:11px;padding:4px 10px}
.icon-btn.primary:hover{background:var(--accent-hover)}
.proj-cols{display:grid;grid-template-columns:1fr 70px;gap:8px;padding:5px 10px;background:#1c1c1c;
border-bottom:1px solid var(--border);color:#777;font-size:10px;font-weight:600;text-transform:uppercase}
.proj-list{overflow-y:auto;height:100%;min-height:100px}
.proj-item{display:grid;grid-template-columns:32px 1fr 70px;gap:8px;padding:5px 8px;align-items:center;
cursor:pointer;border-bottom:1px solid #1c1c1c}
.proj-item:hover{background:#2a2a2a}.proj-item.selected{background:#2b4a75}
.proj-thumb{width:32px;height:22px;background:#111;border:1px solid #333;border-radius:2px;
display:flex;align-items:center;justify-content:center;font-size:12px;color:#777;overflow:hidden}
.proj-thumb img{width:100%;height:100%;object-fit:cover}
.proj-name{font-size:11px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-dur{font-size:10px;color:#888;text-align:right;font-family:Consolas,monospace}
.empty-hint{padding:20px 12px;text-align:center;color:#666;font-size:11px;line-height:1.9}
.empty-hint b{color:#4a9eff}
.monitor-wrap{display:flex;flex-direction:column;flex:1;background:#0f0f0f;overflow:hidden}
.monitor-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.monitor-canvas-wrap canvas{max-width:100%;max-height:100%;background:#000;border:1px solid #111;box-shadow:0 0 12px rgba(0,0,0,.9);cursor:crosshair}
.monitor-ctrl{height:36px;background:var(--panel-head);border-top:1px solid var(--border);
display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}
.monitor-ctrl button{background:transparent;border:none;color:#c9c9c9;cursor:pointer;padding:4px 8px;border-radius:3px;font-size:13px}
.monitor-ctrl button:hover{background:#3a3a3a;color:#fff}
.tc-display{font-family:Consolas,monospace;font-size:11px;color:#4a9eff;letter-spacing:.5px;margin-left:8px}
.eff-item{background:#1c1c1c;border-bottom:1px solid #111}
.eff-title{padding:6px 10px;background:#242424;color:#ddd;font-weight:600;font-size:11px;display:flex;align-items:center;gap:6px}
.eff-title .badge{background:var(--accent);color:#fff;font-size:9px;padding:1px 6px;border-radius:6px;margin-left:auto}
.eff-ctrl{padding:8px 10px;display:flex;flex-direction:column;gap:7px}
.eff-row{display:flex;align-items:center;gap:6px}
.eff-row label{color:#aaa;font-size:10px;min-width:65px}
.eff-row input[type=range]{flex:1;accent-color:var(--accent);height:3px}
.eff-row input[type=text]{flex:1;background:#111;color:#fff;border:1px solid #444;border-radius:3px;padding:4px 6px;font-size:11px}
.eff-row textarea{flex:1;background:#111;color:#fff;border:1px solid #444;border-radius:3px;padding:4px 6px;font-size:11px;resize:vertical;min-height:36px;font-family:inherit}
.eff-row select{flex:1;background:#111;color:#fff;border:1px solid #444;border-radius:3px;padding:4px 6px;font-size:11px}
.eff-row .val{font-family:Consolas,monospace;color:#4a9eff;font-size:10px;min-width:38px;text-align:right}
.eff-row input[type=color]{width:32px;height:24px;border:1px solid #444;background:#111;border-radius:3px;padding:0;cursor:pointer}
.eff-row input[type=checkbox]{accent-color:var(--accent)}
.timeline{display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
.tl-header{height:32px;background:var(--panel-head);border-bottom:1px solid var(--border);
display:flex;align-items:center;padding:0 10px;gap:8px}
.seq-tab{background:#1e1e1e;border:1px solid #333;border-top:2px solid var(--accent);
padding:4px 12px;border-radius:3px 3px 0 0;color:#ddd;font-size:11px;font-weight:600}
.tl-tools{display:flex;gap:2px;margin-left:10px;align-items:center}
.tool-btn{background:transparent;border:1px solid transparent;color:#999;padding:4px 9px;border-radius:3px;cursor:pointer;font-size:11px;
display:flex;align-items:center;gap:5px}
.tool-btn:hover{background:#2e2e2e;color:#fff}
.tool-btn.active{background:#2b4a75;color:#fff;border-color:var(--accent)}
.tool-btn.split{background:#8a3a11;color:#fff;border-color:#b04a15;font-weight:700}
.tool-btn.split:hover{background:#b04a15}
.tool-btn.txt{background:#6a3a7a;color:#fff;border-color:#8a4a9a;font-weight:700}
.tool-btn.txt:hover{background:#8a4a9a}
.tool-btn.lgo{background:#8a4a11;color:#fff;border-color:#b06a1a;font-weight:700}
.tool-btn.lgo:hover{background:#b06a1a}
.tl-hint{margin-left:auto;color:#777;font-size:10px;display:flex;align-items:center;gap:8px}
.tl-hint b{color:#ff9500}
.tl-zoom{display:flex;align-items:center;gap:6px;color:#888;font-size:10px;margin-left:12px}
.tl-zoom input{width:100px;accent-color:var(--accent)}
.tl-body{flex:1;display:grid;grid-template-columns:170px 1fr;overflow:hidden}
.th-col{background:#1c1c1c;border-right:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.th-spacer{height:26px;background:#181818;border-bottom:1px solid var(--border)}
.th{display:flex;align-items:center;padding:0 8px;gap:5px;border-bottom:1px solid #111;cursor:pointer;position:relative;height:46px}
.th.text{background:#2a1e2f}.th.logo{background:#2f2519}
.th.video{background:#222629}.th.audio{background:#212a23}
.th:hover{filter:brightness(1.15)}
.th.target{box-shadow:inset 4px 0 0 var(--target)}
.th.target::after{content:'◆';position:absolute;right:6px;top:3px;font-size:9px;color:var(--target);font-weight:800}
.th .name{font-weight:800;color:#ddd;font-size:12px;min-width:26px}
.th .spacer{flex:1}
.th .mini-btn{width:18px;height:18px;background:transparent;border:1px solid transparent;border-radius:2px;
color:#777;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.th .mini-btn:hover{background:#333;color:#fff}
.th .mini-btn.on{color:#4a9eff;background:#1c2a3d}
.th .mini-btn.mute-on{color:#ff5a5a;background:#3a1c1c}
.lanes-col{position:relative;overflow:auto;background:#181818}
.ruler{height:26px;background:#1c1c1c;border-bottom:1px solid var(--border);position:relative;
min-width:3000px;cursor:pointer;overflow:hidden}
.ruler .tick{position:absolute;top:0;height:100%;border-left:1px solid #2a2a2a;color:#888;font-size:9px;
font-family:Consolas,monospace;padding:3px 0 0 4px;pointer-events:none}
.ruler .tick.major{border-left-color:#4a4a4a;color:#c9c9c9}
.tracks{position:relative;min-width:3000px}
.lane{height:46px;border-bottom:1px solid #111;position:relative;background:var(--lane)}
.lane.text{background:#231a28}.lane.logo{background:#241c14}
.lane.audio{background:var(--lane-alt)}.lane.locked{opacity:.6}
.lane.target::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--target);z-index:2}
.clip{position:absolute;top:3px;height:38px;border-radius:3px;overflow:hidden;cursor:pointer;
border:1px solid transparent;display:flex;flex-direction:column;font-size:10px;color:#eaeaea}
.clip.video{background:var(--video-clip);border-color:#5a8bc0}
.clip.audio{background:var(--audio-clip);border-color:#5a8b6a;height:34px;top:5px}
.clip.text{background:var(--text-clip);border-color:#b06ac0}
.clip.logo{background:var(--logo-clip);border-color:#e0a04a}
.clip.selected{box-shadow:0 0 0 2px var(--selected);z-index:5}
.clip .clip-name{background:rgba(0,0,0,.35);padding:2px 6px;font-weight:600;overflow:hidden;
white-space:nowrap;text-overflow:ellipsis;font-size:10px;display:flex;align-items:center;gap:4px}
.clip .clip-name .track-badge{background:rgba(255,255,255,.25);border-radius:2px;padding:0 4px;font-size:9px;font-weight:800}
.clip .strip{flex:1;background-image:repeating-linear-gradient(90deg,transparent 0,transparent 44px,rgba(0,0,0,.25) 44px,rgba(0,0,0,.25) 45px)}
.clip.text .strip{background-image:repeating-linear-gradient(90deg,transparent 0,transparent 22px,rgba(255,255,255,.15) 22px,rgba(255,255,255,.15) 23px)}
.clip.logo .strip{background-image:repeating-linear-gradient(45deg,transparent 0,transparent 8px,rgba(255,255,255,.1) 8px,rgba(255,255,255,.1) 16px)}
.playhead{position:absolute;top:0;width:2px;background:var(--playhead);pointer-events:none;z-index:20;
box-shadow:0 0 4px rgba(74,158,255,.6)}
.playhead::before{content:'';position:absolute;top:0;left:-5px;width:12px;height:12px;background:var(--playhead);
clip-path:polygon(0 0,100% 0,50% 100%);pointer-events:auto;cursor:ew-resize}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#1a1a1a}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:#4a4a4a}
.err-banner{position:fixed;top:30px;left:50%;transform:translateX(-50%);background:#7a1f1f;color:#fff;
padding:10px 20px;border-radius:6px;font-size:12px;z-index:9999;max-width:80vw;box-shadow:0 4px 20px rgba(0,0,0,.5);
display:none;font-family:Consolas,monospace}
.err-banner.show{display:block}
.info-banner{position:fixed;top:30px;left:50%;transform:translateX(-50%);background:#1c4a7a;color:#fff;
padding:10px 20px;border-radius:6px;font-size:12px;z-index:9999;max-width:80vw;box-shadow:0 4px 20px rgba(0,0,0,.5);
display:none}
.info-banner.show{display:block}
.drop-active{outline:2px dashed #4a9eff !important;outline-offset:-6px;background:rgba(74,158,255,.08) !important}
select.track-select{background:#1c1c1c;color:#ddd;border:1px solid #444;border-radius:3px;padding:3px 6px;font-size:11px}
</style>
</head>
<body>
<div class="err-banner" id="errBanner"></div>
<div class="info-banner" id="infoBanner"></div>
<div class="app">
  <div class="menubar">
    <div class="logo">Pr</div>
    <div class="menu">File</div><div class="menu">Edit</div><div class="menu">Clip</div>
    <div class="menu">Sequence</div><div class="menu">Window</div><div class="menu">Help</div>
    <div class="spacer"></div>
    <div class="status" id="statusBar">loading…</div>
  </div>

  <div class="middle">
    <div class="panel" id="projectPanel">
      <div class="panel-header"><span class="dot"></span>Project: Tarek.prproj</div>
      <div class="proj-toolbar">
        <button class="icon-btn primary" id="importBtn" type="button">⬆ Import</button>
        <button class="icon-btn" id="deleteBtn" title="Delete" type="button">🗑</button>
        <button class="icon-btn" id="addToTLBtn" title="Add to Timeline" style="margin-left:auto;background:#2b4a75;color:#fff;padding:4px 10px" type="button">＋ Add</button>
      </div>
      <div style="padding:5px 10px;background:#1c1c1c;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:10px;color:#888">
        <span>إلى المسار:</span>
        <select class="track-select" id="targetTrackSelect">
          <option value="auto">تلقائي</option>
          <option value="V1">V1 (فيديو 1)</option>
          <option value="V2">V2 (فيديو 2)</option>
          <option value="A1">A1 (صوت 1)</option>
          <option value="A2">A2 (صوت 2)</option>
        </select>
      </div>
      <div class="proj-cols"><div>Name</div><div>Duration</div></div>
      <div class="proj-list" id="projList"></div>
      <input type="file" id="fileInput" accept="video/*,image/*,audio/*" multiple hidden>
    </div>

    <div class="panel">
      <div class="panel-header"><span class="dot" style="background:#888"></span>Source: <span id="sourceTitle" style="color:#888;font-weight:400">no clip selected</span></div>
      <div class="monitor-wrap">
        <div class="monitor-canvas-wrap"><canvas id="sourceCanvas" width="640" height="360"></canvas></div>
        <div class="monitor-ctrl">
          <button>⏮</button><button>◀◀</button><button id="srcPlay">▶</button>
          <button>▶▶</button><button>⏭</button>
          <span class="tc-display" id="srcTC">00:00:00:00</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><span class="dot"></span>Program: Sequence 01</div>
      <div class="monitor-wrap">
        <div class="monitor-canvas-wrap"><canvas id="programCanvas" width="640" height="360"></canvas></div>
        <div class="monitor-ctrl">
          <button>⏮</button><button>◀◀</button><button id="progPlay">▶</button>
          <button>▶▶</button><button>⏭</button>
          <span class="tc-display" id="progTC">00:00:00:00</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header"><span class="dot" style="background:#888"></span>Effect Controls</div>
      <div class="panel-body" id="effBody"></div>
    </div>
  </div>

  <div class="timeline">
    <div class="tl-header">
      <div class="seq-tab">Sequence 01</div>
      <div class="tl-tools">
        <button class="tool-btn active" data-tool="select" type="button" title="Selection (V)">➤</button>
        <button class="tool-btn" data-tool="hand" type="button" title="Hand (H)">✋</button>
        <button class="tool-btn txt" id="addTextBtn" type="button" title="Add Text at Playhead">＋ نص</button>
        <button class="tool-btn lgo" id="addLogoBtn" type="button" title="Add Logo at Playhead">＋ لوغو</button>
        <button class="tool-btn split" id="splitBtn" type="button" title="Split at Playhead (Ctrl+K)">✂ Split</button>
      </div>
      <div class="tl-hint">
        Target: <b id="targetLabel">V1</b>
      </div>
      <div class="tl-zoom"><span>Zoom</span><input type="range" id="zoomRange" min="15" max="200" value="60"></div>
    </div>
    <div class="tl-body">
      <div class="th-col" id="thCol"><div class="th-spacer"></div></div>
      <div class="lanes-col" id="lanesCol">
        <div class="ruler" id="ruler"></div>
        <div class="tracks" id="tracks"></div>
        <div class="playhead" id="playhead" style="left:0"></div>
      </div>
    </div>
  </div>
</div>
<input type="file" id="logoFileInput" accept="image/*" hidden>

<script>
/* ================ GLOBAL ERROR ================ */
const errBanner = document.getElementById('errBanner');
const infoBanner = document.getElementById('infoBanner');
function showError(msg){console.error('[Pr FATAL]',msg);errBanner.textContent='⚠ '+msg;errBanner.classList.add('show');
  setTimeout(()=>errBanner.classList.remove('show'),6000);}
function showInfo(msg){infoBanner.textContent=msg;infoBanner.classList.add('show');
  clearTimeout(showInfo._t);showInfo._t=setTimeout(()=>infoBanner.classList.remove('show'),2500);}
window.addEventListener('error',e=>showError(e.message));
window.addEventListener('unhandledrejection',e=>showError('Promise: '+(e.reason?.message||e.reason)));

/* ================ HELPERS ================ */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LOG=(...a)=>console.log('[Pr]',...a);
const pad2=n=>String(n).padStart(2,'0');
function tc(sec){sec=Math.max(0,sec||0);
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60),f=Math.floor((sec%1)*30);
  return `${pad2(h)}:${pad2(m)}:${pad2(s)}:${pad2(f)}`;}

/* ================ STATE ================ */
const TRACKS = ['T1','L1','V2','V1','A1','A2'];
const TRACK_INFO = {
  T1:{type:'text',label:'T1',name:'نصوص'},
  L1:{type:'logo',label:'L1',name:'لوغو'},
  V2:{type:'video',label:'V2',name:'فيديو 2'},
  V1:{type:'video',label:'V1',name:'فيديو 1'},
  A1:{type:'audio',label:'A1',name:'صوت 1'},
  A2:{type:'audio',label:'A2',name:'صوت 2'}
};
const state = {
  project:[], tracks:{T1:[],L1:[],V2:[],V1:[],A1:[],A2:[]},
  playhead:0, zoom:60, selection:null, selectedAsset:null,
  tool:'select', playing:false,
  targetTrack:'V1',
  locked:{T1:false,L1:false,V2:false,V1:false,A1:false,A2:false},
  visible:{T1:true,L1:true,V2:true,V1:true},
  muted:{A1:false,A2:false}, solo:{A1:false,A2:false},
  chroma:{on:false,color:'#00ff00',tol:40},
  effects:{opacity:100,brightness:100,contrast:100,saturation:100}
};

const videoPool={};
function getVideo(src){
  if(!videoPool[src]){const v=document.createElement('video');
    v.src=src;v.preload='auto';v.muted=true;v.playsInline=true;videoPool[src]=v;}
  return videoPool[src];
}
const imageCache={};
function getImage(src){
  if(!imageCache[src]){const i=new Image();i.src=src;imageCache[src]=i;}
  return imageCache[src];
}

/* ================ FONT LIST ================ */
const ARABIC_FONTS=[
  {id:'Cairo',name:'القاهرة (Cairo)'},
  {id:'Tajawal',name:'تجوال (Tajawal)'},
  {id:'El Messiri',name:'المسيري (El Messiri)'},
  {id:'Changa',name:'شنغا (Changa)'},
  {id:'Amiri',name:'أميري (Amiri) - كلاسيكي'},
  {id:'Almarai',name:'المراعي (Almarai)'}
];
const ENGLISH_FONTS=[
  {id:'Roboto',name:'Roboto'},
  {id:'Montserrat',name:'Montserrat'},
  {id:'Poppins',name:'Poppins'},
  {id:'Oswald',name:'Oswald'},
  {id:'Bebas Neue',name:'Bebas Neue'}
];

/* ================ IMPORT ================ */
function detectKind(file){
  if(file.type&&file.type.startsWith('video/'))return 'video';
  if(file.type&&file.type.startsWith('audio/'))return 'audio';
  if(file.type&&file.type.startsWith('image/'))return 'image';
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(['mp4','webm','mov','mkv','avi','m4v','ogv','3gp'].includes(ext))return 'video';
  if(['mp3','wav','ogg','m4a','aac','flac'].includes(ext))return 'audio';
  if(['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext))return 'image';
  return null;
}
function probeVideo(src){return new Promise(resolve=>{
  const v=document.createElement('video');v.preload='metadata';v.muted=true;v.playsInline=true;
  let done=false;const finish=(dur,thumb)=>{if(done)return;done=true;clearTimeout(timer);
    resolve({duration:dur||5,thumb:thumb||null});};
  const timer=setTimeout(()=>finish(5,null),6000);
  v.onloadedmetadata=()=>{const dur=(isFinite(v.duration)&&v.duration>0)?v.duration:5;
    try{v.currentTime=Math.min(0.5,dur/2);}catch(_){finish(dur,null);}
    setTimeout(()=>finish(dur,null),1500);};
  v.onseeked=()=>{try{const c=document.createElement('canvas');c.width=80;c.height=45;
    c.getContext('2d').drawImage(v,0,0,80,45);
    finish(v.duration||5,c.toDataURL('image/jpeg',.6));}catch(_){finish(v.duration||5,null);}};
  v.onerror=()=>finish(5,null);v.src=src;
});}
function probeAudio(src){return new Promise(resolve=>{
  const a=document.createElement('audio');a.preload='metadata';let done=false;
  const finish=d=>{if(done)return;done=true;clearTimeout(t);resolve(d||5);};
  const t=setTimeout(()=>finish(5),4000);
  a.onloadedmetadata=()=>finish(a.duration);a.onerror=()=>finish(5);a.src=src;
});}
async function importFiles(files){
  if(!files||!files.length)return;
  for(const f of files){
    const kind=detectKind(f);
    if(!kind){console.warn('[Pr] unsupported:',f.name);continue;}
    const src=URL.createObjectURL(f);
    const asset={id:'a_'+Math.random().toString(36).slice(2,9),
      name:f.name,src,kind,duration:5,thumb:null,status:'loading'};
    if(kind==='image'){asset.duration=5;asset.thumb=src;asset.status='ready';}
    else if(kind==='video'){const{duration,thumb}=await probeVideo(src);
      asset.duration=duration;asset.thumb=thumb;asset.status='ready';}
    else{asset.duration=await probeAudio(src);asset.status='ready';}
    state.project.push(asset);renderProject();updateStatus();
  }
}

/* ================ PROJECT PANEL ================ */
function renderProject(){

/* ================ SOURCE MONITOR ================ */
function showInSource(asset){
  $('#sourceTitle').textContent=asset.name;
  const c=$('#sourceCanvas'),ctx=c.getContext('2d');
  ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
  if(asset.kind==='image'){
    const img=getImage(asset.src);
    const draw=()=>drawContain(ctx,img,c.width,c.height);
    img.complete?draw():(img.onload=draw);
  }else if(asset.kind==='video'){
    const v=getVideo(asset.src);
    const draw=()=>{if(v.readyState>=2)drawContain(ctx,v,c.width,c.height);};
    v.onseeked=draw;v.onloadeddata=draw;
    try{v.currentTime=0;}catch(_){}
  }else{
    ctx.fillStyle='#666';ctx.font='14px Tahoma';ctx.textAlign='center';
    ctx.fillText('♪ '+asset.name,c.width/2,c.height/2);
  }
}
function drawContain(ctx,src,W,H){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height;
  if(!sw||!sh)return;
  const r=Math.min(W/sw,H/sh);const w=sw*r,h=sh*r;
  ctx.drawImage(src,(W-w)/2,(H-h)/2,w,h);
}

/* ================ ADD ASSET TO TIMELINE ================ */
function resolveTargetTrack(asset){
  const sel=$('#targetTrackSelect').value;
  if(sel!=='auto'){
    const t=TRACK_INFO[sel];
    const compatible=(asset.kind==='audio'&&t.type==='audio')||(asset.kind!=='audio'&&t.type==='video');
    if(compatible)return sel;
  }
  if(state.targetTrack){
    const t=TRACK_INFO[state.targetTrack];
    const compatible=(asset.kind==='audio'&&t.type==='audio')||(asset.kind!=='audio'&&t.type==='video');
    if(compatible)return state.targetTrack;
  }
  if(asset.kind==='audio')return state.tracks.A1.length<=state.tracks.A2.length?'A1':'A2';
  return state.tracks.V1.length<=state.tracks.V2.length?'V1':'V2';
}
function addAssetToTimeline(asset){
  if(!asset){alert('اختر ملفًا من Project أولاً');return;}
  const trackName=resolveTargetTrack(asset);
  const lane=state.tracks[trackName];
  const start=lane.reduce((m,c)=>Math.max(m,c.start+c.duration),0);
  const clip={id:'c_'+Math.random().toString(36).slice(2,9),
    assetId:asset.id,name:asset.name,src:asset.src,kind:asset.kind,
    type:asset.kind,track:trackName,start,duration:asset.duration||5};
  lane.push(clip);
  state.selection=clip.id;
  showInfo(`✅ أضيف "${asset.name}" إلى ${trackName} عند ${tc(start)}`);
  renderTimeline();renderProgram();renderEffectControls();updateStatus();
}

/* ================ SPLIT ================ */
function splitAtPlayhead(){
  let targetClip=null,targetTrack=null;
  if(state.selection){
    for(const tname of TRACKS){
      const c=state.tracks[tname].find(x=>x.id===state.selection);
      if(c){targetClip=c;targetTrack=tname;break;}
    }
  }
  if(!targetClip){
    const lane=state.tracks[state.targetTrack]||[];
    targetClip=lane.find(c=>state.playhead>c.start+0.05&&state.playhead<c.start+c.duration-0.05);
    if(targetClip)targetTrack=state.targetTrack;
  }
  if(!targetClip){
    for(const tname of TRACKS){
      const c=state.tracks[tname].find(x=>
        state.playhead>x.start+0.05&&state.playhead<x.start+x.duration-0.05);
      if(c){targetClip=c;targetTrack=tname;break;}
    }
  }
  if(!targetClip){showError('لا يوجد مقطع تحت خط التشغيل');return;}
  const localTime=state.playhead-targetClip.start;
  if(localTime<=0.05||localTime>=targetClip.duration-0.05){
    showError('المؤشر عند حافة المقطع — حرّكه للداخل قليلًا');return;}
  const first={...targetClip,duration:localTime};
  const second={...targetClip,
    id:(targetClip.type==='text'?'t_':targetClip.type==='logo'?'l_':'c_')+Math.random().toString(36).slice(2,9),
    start:state.playhead,
    duration:targetClip.duration-localTime};
  const lane=state.tracks[targetTrack];
  const i=lane.findIndex(c=>c.id===targetClip.id);
  lane.splice(i,1,first,second);
  state.selection=second.id;
  showInfo(`✂ تم التقطيع على ${targetTrack} عند ${tc(state.playhead)}`);
  renderTimeline();renderProgram();renderEffectControls();updateStatus();
}
$('#splitBtn').addEventListener('click',splitAtPlayhead);

/* ================ TIMELINE RENDER ================ */
function renderTimeline(){
  const thCol=$('#thCol');
  thCol.innerHTML='<div class="th-spacer"></div>';
  TRACKS.forEach(name=>{
    const info=TRACK_INFO[name];
    const h=document.createElement('div');
    h.className='th '+info.type+(state.targetTrack===name?' target':'');
    h.dataset.track=name;
    const eye=(info.type==='video'||info.type==='text'||info.type==='logo')
      ?`<button class="mini-btn ${state.visible[name]?'on':''}" data-act="eye" data-t="${name}" type="button">👁</button>`:'';
    const lock=`<button class="mini-btn ${state.locked[name]?'on':''}" data-act="lock" data-t="${name}" type="button">🔒</button>`;
    const mute=info.type==='audio'
      ?`<button class="mini-btn ${state.muted[name]?'mute-on':''}" data-act="mute" data-t="${name}" type="button">M</button>`:'';
    const solo=info.type==='audio'
      ?`<button class="mini-btn ${state.solo[name]?'on':''}" data-act="solo" data-t="${name}" type="button">S</button>`:'';
    h.innerHTML=`<span class="name">${name}</span><span class="spacer"></span>${eye}${lock}${mute}${solo}`;
    thCol.appendChild(h);
  });
  thCol.querySelectorAll('.mini-btn').forEach(b=>{
    b.onclick=ev=>{ev.stopPropagation();const{act,t}=b.dataset;
      if(act==='eye')state.visible[t]=!state.visible[t];
      if(act==='lock')state.locked[t]=!state.locked[t];
      if(act==='mute')state.muted[t]=!state.muted[t];
      if(act==='solo')state.solo[t]=!state.solo[t];
      renderTimeline();renderProgram();};
  });
  thCol.querySelectorAll('.th').forEach(h=>{
    h.onclick=()=>{state.targetTrack=h.dataset.track;
      $('#targetLabel').textContent=h.dataset.track;renderTimeline();};
  });

  renderRuler();

  const tracks=$('#tracks');tracks.innerHTML='';
  TRACKS.forEach(name=>{
    const info=TRACK_INFO[name];
    const lane=document.createElement('div');
    lane.className='lane '+info.type+(state.targetTrack===name?' target':'');
    lane.dataset.track=name;
    if(state.locked[name])lane.classList.add('locked');

    state.tracks[name].forEach(clip=>{
      const el=document.createElement('div');
      el.className='clip '+info.type;
      el.dataset.id=clip.id;el.dataset.track=name;
      el.style.left=(clip.start*state.zoom)+'px';
      el.style.width=Math.max(6,clip.duration*state.zoom)+'px';
      if(state.selection===clip.id)el.classList.add('selected');
      const displayName=clip.type==='text'?('📝 '+clip.text):(clip.type==='logo'?'🖼 لوغو':clip.name);
      el.innerHTML=`
        <div class="clip-name"><span class="track-badge">${name}</span>${displayName}</div>
        <div class="strip"></div>`;
      bindClipEvents(el,clip,name);
      lane.appendChild(el);
    });

    lane.addEventListener('dragover',e=>{e.preventDefault();});
    lane.addEventListener('drop',e=>{
      e.preventDefault();
      if(!state.selectedAsset)return;
      const a=state.project.find(x=>x.id===state.selectedAsset);
      if(!a)return;
      const compatible=(a.kind==='audio'&&info.type==='audio')||(a.kind!=='audio'&&info.type==='video');
      if(!compatible){showError(`لا يمكن وضع ${a.kind} في مسار ${info.type}`);return;}
      const rect=tracks.getBoundingClientRect();
      const start=Math.max(0,(e.clientX-rect.left)/state.zoom);
      state.tracks[name].push({
        id:'c_'+Math.random().toString(36).slice(2,9),
        assetId:a.id,name:a.name,src:a.src,kind:a.kind,type:a.kind,
        track:name,start,duration:a.duration||5});
      renderTimeline();renderProgram();updateStatus();
    });
    tracks.appendChild(lane);
  });

  updatePlayhead();updateTC();
}

function renderRuler(){
  const ruler=$('#ruler');
  const w=Math.max(state.zoom*60+400,3000);
  ruler.style.width=w+'px';ruler.innerHTML='';
  const step=state.zoom>=80?1:state.zoom>=40?2:state.zoom>=20?5:10;
  const loops=Math.floor(w/state.zoom/step);
  for(let i=0;i<=loops;i++){
    const s=i*step;
    const t=document.createElement('div');
    t.className='tick'+(s%(step*5)===0?' major':'');
    t.style.left=(s*state.zoom)+'px';
    if(s%(step*5)===0)t.textContent=tc(s);
    ruler.appendChild(t);
  }
}

/* ================ CLIP DRAG ================ */
let activeDrag=null;
document.addEventListener('mousemove',e=>{
  if(!activeDrag)return;
  const dx=e.clientX-activeDrag.startX;
  activeDrag.clip.start=Math.max(0,activeDrag.origStart+dx/state.zoom);
  renderTimeline();updateStatus();
});
document.addEventListener('mouseup',()=>{
  if(activeDrag){activeDrag=null;document.body.style.cursor='';}
});
function bindClipEvents(el,clip,trackName){
  el.addEventListener('mousedown',e=>{
    if(state.locked[trackName])return;
    e.stopPropagation();
    state.selection=clip.id;
    state.targetTrack=trackName;
    $('#targetLabel').textContent=trackName;
    activeDrag={clip,startX:e.clientX,origStart:clip.start};
    renderTimeline();renderEffectControls();
    document.body.style.cursor='grabbing';
  });
}

/* ================ RULER SCRUB ================ */
const ruler=$('#ruler');
let scrubbing=false;
ruler.addEventListener('mousedown',e=>{
  scrubbing=true;const rect=ruler.getBoundingClientRect();
  seekToPx(e.clientX-rect.left);
});
window.addEventListener('mousemove',e=>{
  if(!scrubbing)return;const rect=ruler.getBoundingClientRect();
  seekToPx(e.clientX-rect.left);
});
window.addEventListener('mouseup',()=>{scrubbing=false;});

function seekToPx(px){state.playhead=Math.max(0,px/state.zoom);
  updatePlayhead();updateTC();renderProgram();updateStatus();}
function updatePlayhead(){$('#playhead').style.left=(state.playhead*state.zoom)+'px';}
function updateTC(){$('#progTC').textContent=tc(state.playhead);}

/* ================ TOOLS ================ */
function setTool(t){state.tool=t;
  $$('.tool-btn[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));}
$$('.tool-btn[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));

$('#logoFileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>addLogoClip(URL.createObjectURL(f),img);
  img.src=URL.createObjectURL(f);
  e.target.value='';
});

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='v'||e.key==='V')setTool('select');
  if(e.key==='h'||e.key==='H')setTool('hand');
  if(e.key==='t'||e.key==='T'){e.preventDefault();addTextClip();}
  if(e.key===' '){e.preventDefault();togglePlay();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K'||e.key==='b'||e.key==='B')){
    e.preventDefault();splitAtPlayhead();}
  if(e.key==='Delete'&&state.selection){
    TRACKS.forEach(n=>state.tracks[n]=state.tracks[n].filter(c=>c.id!==state.selection));
    state.selection=null;
    renderTimeline();renderProgram();renderEffectControls();updateStatus();}
});

$('#zoomRange').addEventListener('input',e=>{state.zoom=+e.target.value;renderTimeline();});

  $('#txtX').addEventListener('input',e=>{clip.x=+e.target.value;

  $('#txtDur').addEventListener('input',e=>{clip.duration=+e.target.value;

    renderTimeline();renderProgram();});
}

/* ================ PROGRAM MONITOR ================ */
const progCanvas=$('#programCanvas');
const progCtx=progCanvas.getContext('2d');
const chromaCanvas=document.createElement('canvas');
const chromaCtx=chromaCanvas.getContext('2d',{willReadFrequently:true});

function getActiveClips(trackName){
  return state.tracks[trackName].filter(c=>
    state.playhead>=c.start && state.playhead<=c.start+c.duration);
}

function renderProgram(){
  const W=progCanvas.width,H=progCanvas.height;
  progCtx.fillStyle='#000';progCtx.fillRect(0,0,W,H);

  // 1. Video layers (V1 bottom, V2 top)
  progCtx.save();
  const fx=state.effects;
  progCtx.globalAlpha=fx.opacity/100;
  progCtx.filter=`brightness(${fx.brightness}%) contrast(${fx.contrast}%) saturate(${fx.saturation}%)`;

  const videoClips=[];
  if(state.visible.V1)state.tracks.V1.forEach(c=>videoClips.push({...c,_t:'V1'}));
  if(state.visible.V2)state.tracks.V2.forEach(c=>videoClips.push({...c,_t:'V2'}));
  const activeVideo=videoClips.filter(c=>
    state.playhead>=c.start&&state.playhead<=c.start+c.duration);
  activeVideo.forEach(active=>{
    if(active.kind==='image'){
      const img=getImage(active.src);
      if(img.complete)drawContain(progCtx,img,W,H);
      else img.onload=()=>drawContain(progCtx,img,W,H);
    }else if(active.kind==='video'){
      const v=getVideo(active.src);
      const local=state.playhead-active.start;
      if(v.readyState>=1&&Math.abs(v.currentTime-local)>0.15){
        try{v.currentTime=local;}catch(_){}}
      if(v.readyState>=2){
        if(state.chroma.on)drawWithChroma(progCtx,v,W,H);
        else drawContain(progCtx,v,W,H);
      }
    }
  });
  progCtx.restore();

  // 2. Logo layer
  if(state.visible.L1){
    getActiveClips('L1').forEach(clip=>{
      const img=clip.img||getImage(clip.src);
      const draw=()=>{
        progCtx.save();
        progCtx.globalAlpha=(clip.opacity??100)/100;
        progCtx.drawImage(img,clip.x,clip.y,clip.width,clip.height);
        progCtx.restore();
      };
      if(img.complete)draw();else img.onload=draw;
    });
  }

  // 3. Text layer (topmost)
  if(state.visible.T1){
    getActiveClips('T1').forEach(clip=>{
      progCtx.save();
      progCtx.font=`${clip.bold?'bold':'normal'} ${clip.fontSize}px ${clip.fontFamily}, Tahoma`;
      progCtx.textAlign='center';
      progCtx.textBaseline='middle';
      if(clip.shadow){
        progCtx.shadowColor='rgba(0,0,0,0.85)';
        progCtx.shadowBlur=10;
        progCtx.shadowOffsetX=2;
        progCtx.shadowOffsetY=2;
      }
      progCtx.fillStyle=clip.color;
      progCtx.fillText(clip.text,clip.x,clip.y);
      // selection highlight
      if(state.selection===clip.id){
        const w=progCtx.measureText(clip.text).width;
        progCtx.strokeStyle='#ffcc00';
        progCtx.lineWidth=1.5;
        progCtx.setLineDash([5,3]);
        progCtx.shadowColor='transparent';
        progCtx.strokeRect(clip.x-w/2-8,clip.y-clip.fontSize/2-6,w+16,clip.fontSize+12);
      }
      progCtx.restore();
    });
  }
}

function drawWithChroma(ctx,video,W,H){
  chromaCanvas.width=W;chromaCanvas.height=H;
  chromaCtx.drawImage(video,0,0,W,H);
  const frame=chromaCtx.getImageData(0,0,W,H);
  const d=frame.data;
  const kr=parseInt(state.chroma.color.slice(1,3),16);
  const kg=parseInt(state.chroma.color.slice(3,5),16);
  const kb=parseInt(state.chroma.color.slice(5,7),16);
  const tol=state.chroma.tol*2.55,tol2=tol*tol;
  for(let i=0;i<d.length;i+=4){
    const dr=d[i]-kr,dg=d[i+1]-kg,db=d[i+2]-kb;
    if(dr*dr+dg*dg+db*db<tol2)d[i+3]=0;
  }
  chromaCtx.putImageData(frame,0,0);
  ctx.drawImage(chromaCanvas,0,0,W,H);
}

/* ================ CANVAS DRAG (text/logo) ================ */
let canvasDrag=null;
progCanvas.addEventListener('mousedown',e=>{
  const rect=progCanvas.getBoundingClientRect();
  const scaleX=progCanvas.width/rect.width;
  const scaleY=progCanvas.height/rect.height;
  const mx=(e.clientX-rect.left)*scaleX;
  const my=(e.clientY-rect.top)*scaleY;

  // Check text clips (topmost)
  if(state.visible.T1){
    const texts=getActiveClips('T1').slice().reverse();
    for(const t of texts){
      progCtx.save();
      progCtx.font=`${t.bold?'bold':'normal'} ${t.fontSize}px ${t.fontFamily}, Tahoma`;
      const w=progCtx.measureText(t.text).width;
      progCtx.restore();
      if(mx>=t.x-w/2-8&&mx<=t.x+w/2+8&&my>=t.y-t.fontSize/2-6&&my<=t.y+t.fontSize/2+6){
        canvasDrag={type:'text',clip:t,offX:mx-t.x,offY:my-t.y};
        state.selection=t.id;state.targetTrack='T1';
        $('#targetLabel').textContent='T1';
        renderTimeline();renderEffectControls();
        return;
      }
    }
  }
  // Check logo clips
  if(state.visible.L1){
    const logos=getActiveClips('L1').slice().reverse();
    for(const l of logos){
      if(mx>=l.x&&mx<=l.x+l.width&&my>=l.y&&my<=l.y+l.height){
        canvasDrag={type:'logo',clip:l,offX:mx-l.x,offY:my-l.y};
        state.selection=l.id;state.targetTrack='L1';
        $('#targetLabel').textContent='L1';
        renderTimeline();renderEffectControls();
        return;
      }
    }
  }
});

progCanvas.addEventListener('mousemove',e=>{
  if(!canvasDrag)return;
  const rect=progCanvas.getBoundingClientRect();
  const scaleX=progCanvas.width/rect.width;
  const scaleY=progCanvas.height/rect.height;
  const mx=(e.clientX-rect.left)*scaleX;
  const my=(e.clientY-rect.top)*scaleY;
  canvasDrag.clip.x=Math.round(mx-canvasDrag.offX);
  canvasDrag.clip.y=Math.round(my-canvasDrag.offY);
  renderProgram();
  // live update Effect Controls sliders
  if(canvasDrag.type==='text'){
    const xEl=$('#txtX'),yEl=$('#txtY');
    if(xEl){xEl.value=canvasDrag.clip.x;$('#txtXVal').textContent=canvasDrag.clip.x;}
    if(yEl){yEl.value=canvasDrag.clip.y;$('#txtYVal').textContent=canvasDrag.clip.y;}
  }else{
    const xEl=$('#lgoX'),yEl=$('#lgoY');
    if(xEl){xEl.value=canvasDrag.clip.x;$('#lgoXVal').textContent=canvasDrag.clip.x;}
    if(yEl){yEl.value=canvasDrag.clip.y;$('#lgoYVal').textContent=canvasDrag.clip.y;}
  }
});
progCanvas.addEventListener('mouseup',()=>{canvasDrag=null;});
progCanvas.addEventListener('mouseleave',()=>{canvasDrag=null;});

/* ================ PLAYBACK ================ */
let rafId=null,lastT=0;
function togglePlay(){
  state.playing=!state.playing;
  $('#progPlay').textContent=state.playing?'⏸':'▶';
  if(state.playing){
    const all=state.tracks.V1.concat(state.tracks.V2);
    all.forEach(c=>{if(c.kind==='video')getVideo(c.src).play().catch(()=>{});});
    lastT=performance.now();
    rafId=requestAnimationFrame(loop);
  }else{
    Object.values(videoPool).forEach(v=>v.pause());
    if(rafId)cancelAnimationFrame(rafId);
  }
}
function loop(t){
  if(!state.playing)return;
  const dt=(t-lastT)/1000;lastT=t;
  state.playhead+=dt;
  updatePlayhead();updateTC();renderProgram();updateStatus();
  const maxEnd=TRACKS.flatMap(n=>state.tracks[n].map(c=>c.start+c.duration))
    .reduce((a,b)=>Math.max(a,b),0);
  if(maxEnd&&state.playhead>=maxEnd){togglePlay();return;}
  rafId=requestAnimationFrame(loop);
}
$('#progPlay').addEventListener('click',togglePlay);

/* ================ BUTTONS ================ */
const fileInput=$('#fileInput');
$('#importBtn').addEventListener('click',()=>{fileInput.value='';fileInput.click();});
fileInput.addEventListener('change',e=>importFiles([...e.target.files]));
$('#addToTLBtn').addEventListener('click',()=>{
  const a=state.project.find(x=>x.id===state.selectedAsset)||state.project[0];
  if(!a){alert('لا يوجد ملف في Project');return;}
  state.selectedAsset=a.id;addAssetToTimeline(a);
});
$('#deleteBtn').addEventListener('click',()=>{
  if(!state.selectedAsset)return;
  state.project=state.project.filter(x=>x.id!==state.selectedAsset);
  state.selectedAsset=null;renderProject();updateStatus();
});

/* ================ DESKTOP DROP ================ */
const projPanel=$('#projectPanel');
['dragenter','dragover'].forEach(ev=>projPanel.addEventListener(ev,e=>{
  e.preventDefault();e.stopPropagation();projPanel.classList.add('drop-active');}));
['dragleave','dragend'].forEach(ev=>projPanel.addEventListener(ev,e=>{
  if(e.target===projPanel)projPanel.classList.remove('drop-active');}));
projPanel.addEventListener('drop',e=>{
  e.preventDefault();e.stopPropagation();projPanel.classList.remove('drop-active');
  importFiles([...e.dataTransfer.files]);});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());

/* ================ STATUS ================ */
function updateStatus(){
  const total=TRACKS.reduce((s,n)=>s+state.tracks[n].length,0);
  $('#statusBar').textContent=
    `Project: ${state.project.length} | Clips: ${total} | Target: ${state.targetTrack} | ${tc(state.playhead)}`;
}

/* ================ INIT ================ */
function init(){
  LOG('init v2.0');
  $('#targetLabel').textContent=state.targetTrack;
  renderProject();
  renderTimeline();
  renderProgram();
  renderEffectControls();
  updateStatus();
  if(document.fonts&&document.fonts.ready){
    document.fonts.ready.then(()=>{LOG('fonts ready');renderProgram();});
  }
  LOG('ready ✓ — جرّب: ＋ نص لإضافة نص، أو ＋ لوغو لإضافة شعار');
}
document.readyState==='loading'
  ? document.addEventListener('DOMContentLoaded',init)
  : init();
</script>
