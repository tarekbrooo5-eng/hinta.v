<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premiere Pro Web Studio - المصمم طارق ابراهيم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Amiri:wght@700&family=Tajawal:wght@700&family=El+Messiri:wght@700&family=Changa:wght@700&family=Roboto:wght@700&family=Montserrat:wght@700&family=Lobster&family=Oswald:wght@700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background-color: #121212; color: #cccccc; font-family: Tahoma, sans-serif; overflow: hidden; direction: rtl; font-size: 11px; user-select: none; }
        
        .app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; overflow: hidden; }

        .top-menu { background: #1e1e1e; height: 38px; min-height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2d2d2d; z-index: 10; }
        .top-menu .menu-items { display: flex; gap: 15px; color: #aaa; align-items: center; }
        
        .btn-export { background: #008751; color: #fff; font-weight: bold; padding: 5px 14px; border-radius: 4px; border: 1px solid #00aa63; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 6px; }
        .btn-export:hover { background: #00aa63; }

        .main-workspace { display: flex; flex-direction: column; flex: 1; height: calc(100vh - 38px); overflow: hidden; background: #2d2d2d; }
        
        .top-panels { display: flex; flex: 1; min-height: 0; gap: 1px; background: #2d2d2d; }
        .panel { background: #1b1b1b; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        .panel-project { width: 280px; min-width: 280px; }
        .panel-monitor { flex: 1; background: #0f0f0f; }
        .panel-inspector { width: 310px; min-width: 310px; }

        .panel-header { background: #252525; height: 28px; min-height: 28px; display: flex; align-items: center; padding: 0 8px; font-weight: bold; border-bottom: 1px solid #333; color: #ddd; gap: 8px; }
        
        .project-content { padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-content: flex-start; overflow-y: auto; flex: 1; }
        .media-thumb { width: 80px; background: #262626; border: 1px solid #333; padding: 4px; text-align: center; cursor: grab; border-radius: 3px; }
        .media-thumb span { display: block; font-size: 9px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }

        .monitor-pane { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; position: relative; overflow: hidden; }
        .canvas-container { position: relative; display: flex; align-items: center; justify-content: center; width: 400px; height: 225px; background: #000; box-shadow: 0 0 15px rgba(0,0,0,0.9); border: 1px solid #333; }
        
        video#mainPlayer { width: 100%; height: 100%; object-fit: contain; display: none; }
        .canvas-placeholder { position: absolute; color: #666; font-size: 11px; text-align: center; padding: 10px; pointer-events: none; }
        
        .movable-overlay { position: absolute; cursor: move; border: 1px dashed #007acc; display: flex; align-items: center; justify-content: center; padding: 4px; }
        .movable-overlay:hover { border-color: #ffcc00; }
        
        .monitor-controls { height: 36px; min-height: 36px; background: #1e1e1e; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border-top: 1px solid #2d2d2d; }
        
        /* التايملاين السفلي */
        .timeline-pane { height: 230px; min-height: 230px; background: #181818; display: flex; flex-direction: column; border-top: 1px solid #2d2d2d; }
        .timeline-toolbar { height: 30px; min-height: 30px; background: #222; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-bottom: 1px solid #333; }
        .timeline-tracks { flex: 1; overflow-y: auto; overflow-x: auto; display: flex; flex-direction: column; background: #151515; position: relative; min-width: 900px; }
        
        #playheadLine { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffcc00; z-index: 100; pointer-events: none; left: 0px; }
        #playheadLine::before { content: ''; position: absolute; top: 0; left: -4px; border-width: 5px 5px 0 5px; border-style: solid; border-color: #ffcc00 transparent transparent transparent; }

        .track-row { height: 38px; min-height: 38px; background: #1f1f1f; border-bottom: 1px solid #282828; display: flex; align-items: center; position: relative; width: 100%; }
        .track-label { width: 70px; min-width: 70px; background: #252525; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border-right: 2px solid #007acc; font-weight: bold; font-size: 10px; color: #fff; z-index: 10; }
        .track-lane { flex: 1; height: 32px; position: relative; margin: 0 6px; background: #111; border-radius: 2px; }
        
        .clip-item { position: absolute; height: 28px; top: 2px; background: #1c3d5a; border: 1px solid #3178c6; border-radius: 3px; display: flex; align-items: center; padding: 0 8px; font-size: 10px; color: #fff; cursor: pointer; overflow: hidden; white-space: nowrap; z-index: 5; }
        .clip-item.selected { border-color: #ffcc00; background: #23527c; box-shadow: 0 0 4px rgba(255,204,0,0.5); z-index: 6; }
        .clip-item.text-clip { background: #5a331c; border-color: #d97706; }
        .clip-item.image-clip { background: #2e5a1c; border-color: #2e8b57; }
        .clip-item.blur-clip { background: #4a1c5a; border-color: #9932cc; }

        button { background: #333; color: #fff; border: 1px solid #444; padding: 3px 8px; border-radius: 2px; cursor: pointer; font-size: 11px; }
        button:hover { background: #444; }
        
        .effects-content { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; flex: 1; }
        .effect-group { background: #222; padding: 6px 8px; border-radius: 3px; border: 1px solid #333; }
        .effect-group label { display: block; margin-bottom: 3px; color: #aaa; }
        input[type="range"], select, input[type="text"], input[type="color"] { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 2px; }
        input[type="color"] { height: 26px; padding: 0; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="top-menu">
        <div class="menu-items">
            <span style="color: #007acc; font-weight: bold; font-size: 13px;">Premiere Pro Studio</span>
            <span>File</span><span>Edit</span><span>Sequence</span><span>Window</span>
        </div>
        <div>
            <button class="btn-export" onclick="exportFinalVideo()">💾 الحفظ النهائي والتصدير</button>
        </div>
    </div>

    <div class="main-workspace">
        <div class="top-panels">
            <!-- 1. لوحة المشروع -->
            <div class="panel panel-project">
                <div class="panel-header">
                    <span>Project Bin</span>
                    <button onclick="document.getElementById('fileInput').click()" style="margin-right: auto; font-size: 10px;">+ استيراد ميديا</button>
                    <input type="file" id="fileInput" accept="video/*,image/*" multiple style="display: none;">
                </div>
                <div class="project-content" id="projectBin">
                    <div style="color: #666; font-size: 10px; text-align: center; width: 100%; margin-top: 20px;">قم برفع مقاطع أو صور واسحبها للتايملاين</div>
                </div>
            </div>

            <!-- 2. شاشة المعاينة -->
            <div class="panel panel-monitor">
                <div class="panel-header">
                    <span>Program Monitor</span>
                    <span id="timecodeDisplay" style="margin-right: auto; color: #3178c6; font-family: monospace;">00:00:00</span>
                </div>
                <div class="monitor-pane">
                    <div class="canvas-container" id="canvasContainer" onclick="seekTimeline(event)">
                        <div id="canvasPlaceholder" class="canvas-placeholder">شاشة المعاينة فارغة<br>أضف مقاطع للبدء</div>
                        <video id="mainPlayer" playsinline></video>
                        <div id="overlaysStage" style="position:absolute; inset:0; pointer-events:none;"></div>
                    </div>
                </div>
                <div class="monitor-controls">
                    <button onclick="stepFrame(-1)">◀ 1-</button>
                    <button id="playPauseBtn" onclick="togglePlayPlayback()" style="background: #007acc; font-weight: bold;">تشغيل / إيقاف</button>
                    <button onclick="stepFrame(1)">1+ ▶</button>
                    <button onclick="splitSelectedVideoClip()" style="background: #5a331c;">✂ تقطيع الفيديو</button>
                </div>
            </div>

            <!-- 3. لوحة الخصائص Inspector -->
            <div class="panel panel-inspector">
                <div class="panel-header">Inspector & Layers</div>
                <div class="effects-content">
                    <div class="effect-group" style="border: 1px solid #007acc; background: #18222b;">
                        <label style="color: #007acc; font-weight: bold;" id="inspectorTitle">لم يتم تحديد عنصر</label>
                        <div id="videoInspectorControls" style="display:none; margin-top:5px;">
                            <label>سرعة التشغيل (<span id="speedVal">1.0</span>x):</label>
                            <input type="range" id="clipSpeedRange" min="0.5" max="4.0" step="0.25" value="1.0">
                            <label style="margin-top:4px;">السطوع (<span id="brightVal">100</span>%):</label>
                            <input type="range" id="brightnessRange" min="0" max="200" value="100">
                        </div>
                        <div id="textInspectorControls" style="display:none; margin-top:5px;">
                            <input type="text" id="inspectorTextInput" placeholder="نص الطبقة...">
                            <select id="inspectorFont" style="margin-top:4px;">
                                <optgroup label="عربية">
                                    <option value="Cairo">Cairo</option>
                                    <option value="Amiri">Amiri</option>
                                    <option value="Tajawal">Tajawal</option>
                                    <option value="El Messiri">El Messiri</option>
                                    <option value="Changa">Changa</option>
                                </optgroup>
                                <optgroup label="إنجليزية">
                                    <option value="Roboto">Roboto</option>
                                    <option value="Montserrat">Montserrat</option>
                                    <option value="Lobster">Lobster</option>
                                    <option value="Oswald">Oswald</option>
                                    <option value="Courier Prime">Courier Prime</option>
                                </optgroup>
                            </select>
                            <div style="display:flex; gap:5px; margin-top:4px;">
                                <input type="color" id="inspectorTextColor" value="#ffffff">
                                <input type="range" id="inspectorFontSize" min="12" max="80" value="24" title="الحجم">
                            </div>
                        </div>
                    </div>

                    <div class="effect-group">
                        <label>إضافة طبقة نص جديدة:</label>
                        <button onclick="addNewTextLayer()" style="width:100%; background:#734d26;">+ إضافة نص للتايملاين</button>
                    </div>

                    <div class="effect-group">
                        <label>إضافة فلتر البلور (Blur):</label>
                        <div style="display:flex; gap:5px;">
                            <button onclick="addNewBlurLayer('rect')" style="flex:1; background:#4a1c5a;">مستطيل بلور</button>
                            <button onclick="addNewBlurLayer('circle')" style="flex:1; background:#4a1c5a;">دائرة بلور</button>
                        </div>
                    </div>

                    <div class="effect-group">
                        <label>إدارة الطبقات:</label>
                        <button onclick="deleteSelectedClip()" style="width:100%; background:#5a1c1c;">حذف العنصر المحدد</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- التايملاين السفلي -->
        <div class="timeline-pane">
            <div class="timeline-toolbar">
                <span style="color: #fff; font-weight: bold;">Timeline (المسارات الزمنية)</span>
                <button onclick="resetTimeline()" style="background: #5a1c1c; font-size: 10px; margin-right: auto;">تفريغ التايملاين</button>
            </div>
            <div class="timeline-tracks" id="timelineTracksContainer" ondragover="allowDrop(event)">
                <div id="playheadLine"></div>
                <div class="track-row"><div class="track-label">V3 (أعلى)</div><div class="track-lane" id="laneV3" data-track="V3" ondrop="dropToTrack(event, 'V3')" ondragover="allowDrop(event)"></div></div>
                <div class="track-row"><div class="track-label">V2 (وسط)</div><div class="track-lane" id="laneV2" data-track="V2" ondrop="dropToTrack(event, 'V2')" ondragover="allowDrop(event)"></div></div>
                <div class="track-row"><div class="track-label" style="background:#007acc;">V1 (أسفل)</div><div class="track-lane" id="laneV1" data-track="V1" ondrop="dropToTrack(event, 'V1')" ondragover="allowDrop(event)"></div></div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
