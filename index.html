<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر الفيديو الاحترافي - Premiere Web Suite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #cccccc; font-family: Tahoma, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 11px; user-select: none; }
        
        .top-menu { background: #1e1e1e; height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid #2d2d2d; }
        .top-menu .menu-items { display: flex; gap: 15px; color: #aaa; }
        
        .workspace { display: grid; grid-template-columns: 280px 1fr 280px; grid-template-rows: 1fr 240px; flex: 1; gap: 1px; background: #2d2d2d; overflow: hidden; }
        .panel { background: #1b1b1b; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .panel-header { background: #252525; height: 26px; display: flex; align-items: center; padding: 0 8px; font-weight: bold; border-bottom: 1px solid #333; color: #ddd; gap: 8px; }
        
        .project-content { padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-content: flex-start; overflow-y: auto; flex: 1; }
        .media-thumb { width: 75px; background: #262626; border: 1px solid #333; padding: 4px; text-align: center; cursor: pointer; border-radius: 3px; }
        .media-thumb:hover { border-color: #007acc; }
        .media-thumb span { display: block; font-size: 9px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }

        .monitor-pane { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; flex: 1; position: relative; }
        .monitor-controls { height: 36px; background: #1e1e1e; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border-top: 1px solid #2d2d2d; }
        
        .timeline-pane { grid-column: 1 / 3; background: #181818; display: flex; flex-direction: column; border-top: 1px solid #2d2d2d; }
        .timeline-toolbar { height: 32px; background: #222; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-bottom: 1px solid #333; }
        .timeline-tracks { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: #151515; }
        
        .track-row { height: 36px; background: #1f1f1f; border-bottom: 1px solid #282828; display: flex; align-items: center; position: relative; }
        .track-label { width: 60px; background: #252525; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border-left: 2px solid #007acc; font-weight: bold; font-size: 10px; color: #fff; cursor: pointer; }
        .track-label.active { background: #007acc; }
        .track-lane { flex: 1; height: 30px; position: relative; margin: 0 4px; background: #111; border-radius: 2px; }
        
        .clip-item { position: absolute; height: 26px; top: 2px; background: #1c3d5a; border: 1px solid #3178c6; border-radius: 3px; display: flex; align-items: center; padding: 0 6px; font-size: 10px; color: #fff; cursor: pointer; overflow: hidden; white-space: nowrap; }
        .clip-item.selected { border: 2px solid #ffcc00; }
        .clip-v2 { background: #5a1c3d; border-color: #c63178; }

        button { background: #333; color: #fff; border: 1px solid #444; padding: 3px 8px; border-radius: 2px; cursor: pointer; font-size: 11px; }
        button:hover { background: #444; }
        
        .effects-content { padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex: 1; }
        .effect-group { background: #222; padding: 8px; border-radius: 3px; border: 1px solid #333; }
        .effect-group label { display: block; margin-bottom: 4px; color: #aaa; }
        input[type="range"] { width: 100%; accent-color: #007acc; }
        input[type="text"], select { width: 100%; background: #111; border: 1px solid #444; color: #fff; padding: 4px; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="top-menu">
        <div class="menu-items">
            <span style="color: #007acc; font-weight: bold;">Premiere Pro Suite</span>
            <span>File</span><span>Edit</span><span>Clip</span><span>Sequence</span><span>Window</span>
        </div>
        <div style="font-size: 10px; color: #777;">المصمم طارق ابراهيم</div>
    </div>

    <div class="workspace">
        <!-- 1. لوحة المشروع والاستيراد -->
        <div class="panel">
            <div class="panel-header">
                <span>Project Bin</span>
                <button onclick="document.getElementById('fileInput').click()" style="margin-right: auto; font-size: 10px;">+ استيراد ملفات</button>
                <input type="file" id="fileInput" accept="video/*,image/*" multiple style="display: none;">
            </div>
            <div class="project-content" id="projectBin">
                <div style="color: #666; font-size: 10px; text-align: center; width: 100%; margin-top: 20px;">قم بإضافة الفيديوهات والصور لبدء المونتاج</div>
            </div>
        </div>

        <!-- 2. شاشة المعاينة -->
        <div class="panel">
            <div class="panel-header">
                <span>Program Monitor</span>
                <span id="timecodeDisplay" style="margin-right: auto; color: #3178c6; font-family: monospace;">00:00:00:00</span>
            </div>
            <div class="monitor-pane" id="dropZone">
                <video id="mainPlayer" style="max-height: 100%; max-width: 100%; display: none;" playsinline></video>
                <video id="overlayPlayer" style="max-height: 100%; max-width: 100%; display: none; position: absolute; pointer-events: none;" playsinline></video>
                <div id="textOverlay" style="position: absolute; display: none; font-weight: bold; text-shadow: 2px 2px 4px #000;"></div>
                <div id="placeholderText" style="color: #555; text-align: center;">لا توجد وسائط مشغلة حالياً</div>
            </div>
            <div class="monitor-controls">
                <button onclick="stepFrame(-1)" title="إطار للخلف">◀ 1-</button>
                <button id="playPauseBtn" onclick="togglePlayPlayback()" style="background: #007acc; font-weight: bold;">تشغيل / إيقاف</button>
                <button onclick="stepFrame(1)" title="إطار للأمام">1+ ▶</button>
                <button onclick="splitSelectedClip()" style="background: #5a331c;" title="تقطيع الفيديو الحالي">✂ تقطيع</button>
            </div>
        </div>

        <!-- 3. لوحة التأثيرات والخصائص المتقدمة -->
        <div class="panel" style="grid-row: span 2;">
            <div class="panel-header">Effects Controls</div>
            <div class="effects-content">
                <div class="effect-group">
                    <label>التحكم بالمسار المختار: <span id="selectedTrackName" style="color:#007acc; font-weight:bold;">لا شيء</span></label>
                </div>
                <div class="effect-group">
                    <label>السطوع (<span id="brightVal">100</span>%)</label>
                    <input type="range" id="brightnessRange" min="0" max="200" value="100">
                </div>
                <div class="effect-group">
                    <label>الشفافية (<span id="opacityVal">100</span>%)</label>
                    <input type="range" id="opacityRange" min="0" max="100" value="100">
                </div>
                <div class="effect-group">
                    <label>إزالة الكروما (لون مفتاحي)</label>
                    <select id="chromaKeySelect">
                        <option value="none">بدون كروما</option>
                        <option value="green">إزالة الخضراء</option>
                        <option value="blue">إزالة الزرقاء</option>
                    </select>
                </div>
                <div class="effect-group">
                    <label>النص التوضيحي (Text)</label>
                    <input type="text" id="customTextInput" placeholder="اكتب النص هنا...">
                    <label style="margin-top:6px;">حجم النص (<span id="fontSizeVal">24</span>px)</label>
                    <input type="range" id="fontSizeRange" min="12" max="100" value="24">
                </div>
            </div>
        </div>

        <!-- 4. التايملاين الاحترافي -->
        <div class="timeline-pane">
            <div class="timeline-toolbar">
                <span style="color: #fff; font-weight: bold;">Timeline: Sequence 01</span>
                <button onclick="clearTimeline()" style="background: #5a1c1c; font-size: 10px; margin-right: auto;">تفريغ التايملاين</button>
            </div>
            <div class="timeline-tracks">
                <div class="track-row"><div class="track-label" onclick="selectActiveTrack('V3')">V3</div><div class="track-lane" id="laneV3"></div></div>
                <div class="track-row"><div class="track-label active" id="lblV2" onclick="selectActiveTrack('V2')">V2</div><div class="track-lane" id="laneV2"></div></div>
                <div class="track-row"><div class="track-label" id="lblV1" onclick="selectActiveTrack('V1')">V1</div><div class="track-lane" id="laneV1"></div></div>
                <div class="track-row" style="height: 30px;"><div class="track-label" style="border-left-color: #2e8b57;">A1</div><div class="track-lane"></div></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
