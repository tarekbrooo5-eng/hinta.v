<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>استوديو حنطة - جمعية حنطة الخيرية التنموية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@400;700;900&family=El+Messiri:wght@400;700&family=Changa:wght@400;700;800&family=Amiri:wght@400;700&family=Almarai:wght@400;700;800&family=Roboto:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Poppins:wght@400;700;900&family=Oswald:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<style>
:root{--bg:#1a1a1a;--panel:#232323;--panel-head:#2b2b2b;--border:#0d0d0d;--text:#c9c9c9;
--accent:#4a9eff;--accent-hover:#6bb0ff;
--video-clip:#3d6b9a;--audio-clip:#3d6b4a;--text-clip:#8a4a9a;--logo-clip:#b06a1a;
--selected:#ffcc00;--playhead:#4a9eff;--lane:#1e1e1e;--lane-alt:#202020;--target:#ff9500;
--brand:#c9a961;--brand-dark:#8a7530;--export:#22a85c;--export-hover:#2dc46e;--transition:#ffb020;--reverse:#e63946;
--safe-top:env(safe-area-inset-top,0px);
--safe-bottom:env(safe-area-inset-bottom,0px);
--safe-left:env(safe-area-inset-left,0px);
--safe-right:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);
font-family:'Segoe UI','Cairo',Tahoma,sans-serif;font-size:11px;user-select:none;
touch-action:manipulation;overscroll-behavior:none;position:fixed}
input,textarea,select{font-size:16px !important}

/* ============================================================
   APP LAYOUT
   ============================================================ */
.app{display:grid;grid-template-rows:28px 1fr 340px;width:100vw;height:100vh;gap:1px;background:var(--border);
padding-top:var(--safe-top);padding-bottom:var(--safe-bottom);padding-left:var(--safe-left);padding-right:var(--safe-right)}

/* Mobile panel switcher (only shown on mobile) */
.mobile-tabs{display:none;background:#151515;border-bottom:1px solid var(--border)}
.mobile-tabs button{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;
color:#888;padding:10px 6px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Cairo',sans-serif}
.mobile-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);background:#1c1c1c}

/* ============================================================
   MENUBAR
   ============================================================ */
.menubar{background:#151515;display:flex;align-items:center;padding:0 12px;gap:6px;font-size:11px;color:#b8b8b8;border-bottom:1px solid #0a0a0a;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;padding:3px 10px;background:linear-gradient(135deg,#2b2419,#1a1a1a);border:1px solid var(--brand-dark);border-radius:3px;flex-shrink:0}
.brand .logo-circle{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#e8c87a);display:flex;align-items:center;justify-content:center;color:#1a1a1a;font-weight:900;font-size:12px;font-family:'Cairo',sans-serif;box-shadow:0 0 8px rgba(201,169,97,.4);flex-shrink:0}
.brand .brand-text{color:var(--brand);font-weight:800;font-size:12px;font-family:'Cairo',sans-serif;letter-spacing:.3px;line-height:1.1;white-space:nowrap}
.brand .brand-sub{color:#7a6a45;font-size:9px;font-family:'Tajawal',sans-serif;display:block;margin-top:-1px;white-space:nowrap}
.menu{padding:4px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.menu:hover{background:#2a2a2a;color:#fff}
.menubar .spacer{flex:1;min-width:0}
.menubar .status{color:var(--accent);font-size:10px;font-family:Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menubar .version{color:#5a5a5a;font-size:10px;font-family:Consolas,monospace;flex-shrink:0}

/* ============================================================
   MIDDLE PANELS
   ============================================================ */
.middle{display:grid;grid-template-columns:250px 1fr 270px;gap:1px;background:var(--border);overflow:hidden}
.panel{display:flex;flex-direction:column;background:var(--panel);overflow:hidden;min-width:0}
.panel-header{height:26px;background:var(--panel-head);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:600;color:#ddd;gap:6px;flex-shrink:0;white-space:nowrap;overflow:hidden}
.panel-header .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
.panel-header .dot.brand{background:var(--brand)}
.panel-body{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* Project toolbar */
.proj-toolbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:#212121;border-bottom:1px solid var(--border);flex-wrap:wrap}
.icon-btn{background:transparent;border:1px solid transparent;color:#b8b8b8;padding:3px 7px;border-radius:3px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;touch-action:manipulation;min-height:28px}
.icon-btn:hover{background:#2e2e2e;color:#fff;border-color:#3a3a3a}
.icon-btn:active{background:#3a3a3a}
.icon-btn.primary{background:var(--accent);color:#fff;border-color:#2b7de9;font-size:11px;padding:4px 10px}
.icon-btn.primary:hover{background:var(--accent-hover)}
.proj-cols{display:grid;grid-template-columns:1fr 70px;gap:8px;padding:5px 10px;background:#1c1c1c;border-bottom:1px solid var(--border);color:#777;font-size:10px;font-weight:600;text-transform:uppercase}
.proj-list{overflow-y:auto;height:100%;min-height:100px;-webkit-overflow-scrolling:touch}
.proj-item{display:grid;grid-template-columns:32px 1fr 70px;gap:8px;padding:5px 8px;align-items:center;cursor:pointer;border-bottom:1px solid #1c1c1c;touch-action:manipulation}
.proj-item:hover{background:#2a2a2a}.proj-item.selected{background:#2b4a75}
.proj-item:active{background:#3a5a85}
.proj-thumb{width:32px;height:22px;background:#111;border:1px solid #333;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#777;overflow:hidden;flex-shrink:0}
.proj-thumb img{width:100%;height:100%;object-fit:cover}
.proj-name{font-size:11px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-dur{font-size:10px;color:#888;text-align:right;font-family:Consolas,monospace}
.empty-hint{padding:20px 12px;text-align:center;color:#666;font-size:11px;line-height:1.9}
.empty-hint b{color:var(--accent)}

/* Monitor */
.monitor-wrap{display:flex;flex-direction:column;flex:1;background:#0f0f0f;overflow:hidden;min-height:0}
.monitor-canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;position:relative}
.monitor-canvas-wrap canvas{max-width:100%;max-height:100%;background:#000;border:1px solid #111;box-shadow:0 0 12px rgba(0,0,0,.9);cursor:crosshair;touch-action:none;display:block}
.monitor-ctrl{height:44px;background:var(--panel-head);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 8px;flex-shrink:0}
.monitor-ctrl button{background:transparent;border:none;color:#c9c9c9;cursor:pointer;padding:8px 14px;border-radius:4px;font-size:16px;touch-action:manipulation;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.monitor-ctrl button:hover{background:#3a3a3a;color:#fff}
.monitor-ctrl button:active{background:#4a4a4a}
.tc-display{font-family:Consolas,monospace;font-size:13px;color:var(--accent);letter-spacing:.5px;margin:0 8px;background:#0a0a0a;padding:4px 10px;border-radius:4px;border:1px solid #222;white-space:nowrap}

/* Effects */
.eff-item{background:#1c1c1c;border-bottom:1px solid #111}
.eff-title{padding:8px 12px;background:#242424;color:#ddd;font-weight:600;font-size:11px;display:flex;align-items:center;gap:6px}
.eff-title .badge{background:var(--accent);color:#fff;font-size:9px;padding:2px 8px;border-radius:6px;margin-right:auto}
.eff-title.mixer{background:linear-gradient(90deg,#1a3a2a,#242424);color:#2dc46e;border-bottom:1px solid #1f5c3a}
.eff-title.trans{background:linear-gradient(90deg,#3a2a10,#242424);color:var(--transition);border-bottom:1px solid #5c4519}
.eff-title.anim{background:linear-gradient(90deg,#2a1a3a,#242424);color:#b06ac0;border-bottom:1px solid #4a1f5c}
.eff-ctrl{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.eff-row{display:flex;align-items:center;gap:8px;min-height:36px}
.eff-row label{color:#aaa;font-size:11px;min-width:70px;flex-shrink:0}
.eff-row input[type=range]{flex:1;accent-color:var(--accent);height:6px;touch-action:none}
.eff-row input[type=range].vol-video{accent-color:#4a9eff}
.eff-row input[type=range].vol-music{accent-color:#2dc46e}
.eff-row input[type=text]{flex:1;background:#111;color:#fff;border:1px solid #444;border-radius:3px;padding:8px 10px;font-size:14px}
.eff-row textarea{flex:1;background:#111;color:#fff;border:1px solid #444;border-radius:3px;padding:8px 10px;font-size:14px;resize:vertical;min-height:44px;font-family:inherit}
.eff-row select{flex:1;background:#111;color:#fff;border:1px solid #444;border-radius:3px;padding:8px 10px;font-size:14px;min-height:40px}
.eff-row .val{font-family:Consolas,monospace;color:var(--accent);font-size:11px;min-width:44px;text-align:right}
.eff-row .val.video{color:#4a9eff}.eff-row .val.music{color:#2dc46e}
.eff-row input[type=color]{width:44px;height:40px;border:1px solid #444;background:#111;border-radius:4px;padding:2px;cursor:pointer;flex-shrink:0}
.eff-row input[type=checkbox]{accent-color:var(--accent);width:22px;height:22px;cursor:pointer}
.eff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.eff-grid button{background:#1a1a1a;color:#ccc;border:1px solid #3a3a3a;border-radius:4px;padding:10px 6px;font-size:11px;cursor:pointer;font-weight:600;touch-action:manipulation;min-height:44px}
.eff-grid button:hover{background:#2a2a2a;color:#fff;border-color:var(--accent)}
.eff-grid button:active{background:#2b4a75}
.eff-grid button.active{background:#2b4a75;color:#fff;border-color:var(--accent)}

/* ============================================================
   TIMELINE
   ============================================================ */
.timeline{display:flex;flex-direction:column;background:var(--panel);overflow:hidden;min-height:0}
.tl-header{height:44px;background:var(--panel-head);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:8px;flex-shrink:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tl-header::-webkit-scrollbar{display:none}
.seq-tab{background:#1e1e1e;border:1px solid #333;border-top:2px solid var(--brand);padding:6px 12px;border-radius:3px 3px 0 0;color:#ddd;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
.tl-tools{display:flex;gap:4px;margin-right:8px;align-items:center;flex-shrink:0}
.tool-btn{background:transparent;border:1px solid transparent;color:#999;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:11px;display:flex;align-items:center;gap:5px;white-space:nowrap;touch-action:manipulation;min-height:36px}
.tool-btn:hover{background:#2e2e2e;color:#fff}
.tool-btn:active{background:#3a3a3a}
.tool-btn.active{background:#2b4a75;color:#fff;border-color:var(--accent)}
.tool-btn.split{background:#8a3a11;color:#fff;border-color:#b04a15;font-weight:700}
.tool-btn.split:active{background:#b04a15}
.tool-btn.txt{background:#6a3a7a;color:#fff;border-color:#8a4a9a;font-weight:700}
.tool-btn.txt:active{background:#8a4a9a}
.tool-btn.lgo{background:#8a4a11;color:#fff;border-color:#b06a1a;font-weight:700}
.tool-btn.lgo:active{background:#b06a1a}
.tool-btn.export{background:var(--export);color:#fff;border-color:#1a8a48;font-weight:800;font-size:12px;padding:8px 16px;box-shadow:0 0 10px rgba(34,168,92,.4)}
.tool-btn.export:hover{background:var(--export-hover)}
.tool-btn.export:active{background:#1a8a48}
.tl-hint{color:#777;font-size:10px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.tl-hint b{color:var(--target)}
.tl-zoom{display:flex;align-items:center;gap:6px;color:#888;font-size:10px;flex-shrink:0;margin-right:8px}
.tl-zoom input{width:90px;accent-color:var(--accent);touch-action:none}
.tl-body{flex:1;display:grid;grid-template-columns:150px 1fr;overflow:hidden;min-height:0}
.th-col{background:#1c1c1c;border-left:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.th-spacer{height:26px;background:#181818;border-bottom:1px solid var(--border);flex-shrink:0}
.th{display:flex;align-items:center;padding:0 6px;gap:4px;border-bottom:1px solid #111;cursor:pointer;position:relative;height:46px;flex-shrink:0;touch-action:manipulation}
.th.text{background:#2a1e2f}.th.logo{background:#2f2519}
.th.video{background:#222629}.th.audio{background:#212a23}
.th:active{filter:brightness(1.25)}
.th.target{box-shadow:inset 4px 0 0 var(--target)}
.th.target::after{content:'◆';position:absolute;right:4px;top:3px;font-size:9px;color:var(--target);font-weight:800}
.th .name{font-weight:800;color:#ddd;font-size:12px;min-width:24px}
.th .spacer{flex:1;min-width:0}
.th .mini-btn{width:26px;height:26px;background:transparent;border:1px solid transparent;border-radius:3px;color:#777;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation;flex-shrink:0}
.th .mini-btn:hover{background:#333;color:#fff}
.th .mini-btn:active{background:#444}
.th .mini-btn.on{color:var(--accent);background:#1c2a3d}
.th .mini-btn.mute-on{color:#ff5a5a;background:#3a1c1c}
.lanes-col{position:relative;overflow:auto;background:#181818;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain}
.ruler{height:26px;background:#1c1c1c;border-bottom:1px solid var(--border);position:relative;min-width:3000px;cursor:pointer;overflow:hidden;touch-action:none}
.ruler .tick{position:absolute;top:0;height:100%;border-left:1px solid #2a2a2a;color:#888;font-size:9px;font-family:Consolas,monospace;padding:3px 0 0 4px;pointer-events:none}
.ruler .tick.major{border-left-color:#4a4a4a;color:#c9c9c9}
.tracks{position:relative;min-width:3000px}
.lane{height:46px;border-bottom:1px solid #111;position:relative;background:var(--lane)}
.lane.text{background:#231a28}.lane.logo{background:#241c14}
.lane.audio{background:var(--lane-alt)}.lane.locked{opacity:.6}
.lane.target::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--target);z-index:2}
.clip{position:absolute;top:3px;height:38px;border-radius:3px;overflow:hidden;cursor:pointer;border:1px solid transparent;display:flex;flex-direction:column;font-size:10px;color:#eaeaea;touch-action:none}
.clip.video{background:var(--video-clip);border-color:#5a8bc0}
.clip.video.rev{background:linear-gradient(90deg,#6b3a5a,#8a3a4a);border-color:#c05a6a}
.clip.audio{background:var(--audio-clip);border-color:#5a8b6a;height:34px;top:5px}
.clip.audio.rev{background:linear-gradient(90deg,#6b5a3a,#8a4a3a);border-color:#c07a5a}
.clip.text{background:var(--text-clip);border-color:#b06ac0}
.clip.logo{background:var(--logo-clip);border-color:#e0a04a}
.clip.selected{box-shadow:0 0 0 3px var(--selected);z-index:5}
.clip .clip-name{background:rgba(0,0,0,.35);padding:3px 6px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:10px;display:flex;align-items:center;gap:4px;position:relative;z-index:2}
.clip .clip-name .track-badge{background:rgba(255,255,255,.25);border-radius:2px;padding:0 4px;font-size:9px;font-weight:800}
.clip .clip-name .anim-badge{background:#b06ac0;color:#fff;border-radius:2px;padding:0 4px;font-size:8px;font-weight:800;margin-right:auto}
.clip .clip-name .trans-badge{background:var(--transition);color:#1a1a1a;border-radius:2px;padding:0 4px;font-size:8px;font-weight:800}
.clip .strip{flex:1;background-image:repeating-linear-gradient(90deg,transparent 0,transparent 44px,rgba(0,0,0,.25) 44px,rgba(0,0,0,.25) 45px);position:relative;overflow:hidden}
.clip.text .strip{background-image:repeating-linear-gradient(90deg,transparent 0,transparent 22px,rgba(255,255,255,.15) 22px,rgba(255,255,255,.15) 23px)}
.clip.logo .strip{background-image:repeating-linear-gradient(45deg,transparent 0,transparent 8px,rgba(255,255,255,.1) 8px,rgba(255,255,255,.1) 16px)}
.clip.audio .strip{background:transparent}
.clip .waveform-canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
/* Big touch handles on selected clips */
.clip.selected::before,.clip.selected::after{content:'';position:absolute;top:0;bottom:0;width:14px;
background:rgba(255,204,0,.3);z-index:10;pointer-events:none}
.clip.selected::before{left:0;border-right:2px solid var(--selected)}
.clip.selected::after{right:0;border-left:2px solid var(--selected)}
.transition-marker{position:absolute;top:8px;height:30px;width:26px;background:linear-gradient(180deg,var(--transition),#c98a10);border-radius:3px;cursor:pointer;z-index:6;display:flex;align-items:center;justify-content:center;color:#1a1a1a;font-size:12px;font-weight:900;box-shadow:0 2px 4px rgba(0,0,0,.4);border:1px solid #8a6a10;touch-action:manipulation}
.transition-marker:active{background:#ffc940}
.transition-marker.empty{background:#3a3020;color:#ffb020;border-color:#5a4020;opacity:.7}
.playhead{position:absolute;top:0;width:3px;background:var(--playhead);pointer-events:none;z-index:20;box-shadow:0 0 6px rgba(74,158,255,.8)}
.playhead::before{content:'';position:absolute;top:0;left:-8px;width:19px;height:19px;background:var(--playhead);clip-path:polygon(0 0,100% 0,50% 100%);cursor:grab;touch-action:none}
.playhead::before:active{cursor:grabbing;background:#6bb0ff}

/* ============================================================
   SCROLLBARS
   ============================================================ */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:#1a1a1a}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#4a4a4a}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
.err-banner,.info-banner,.progress-banner,.ffmpeg-overlay{position:fixed;left:50%;transform:translateX(-50%);z-index:9999}
.err-banner{top:calc(36px + var(--safe-top));background:#7a1f1f;color:#fff;padding:12px 20px;border-radius:8px;font-size:12px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.7);display:none;font-family:Consolas,monospace}
.err-banner.show{display:block}
.info-banner{top:calc(36px + var(--safe-top));background:linear-gradient(135deg,#2b2419,#3d3420);color:#e8c87a;border:1px solid var(--brand-dark);padding:12px 20px;border-radius:8px;font-size:12px;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.7);display:none;font-family:'Cairo',sans-serif}
.info-banner.show{display:block}
.progress-banner{top:calc(36px + var(--safe-top));background:#0d3a5c;color:#fff;border:1px solid #1c4a7a;padding:14px 24px;border-radius:8px;font-size:13px;max-width:90vw;min-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.7);display:none;font-family:'Cairo',sans-serif;text-align:center}
.progress-banner.show{display:block}
.progress-bar{width:100%;height:8px;background:#1a2a3a;border-radius:4px;margin-top:12px;overflow:hidden}
.progress-bar > div{height:100%;background:linear-gradient(90deg,#2dc46e,#4a9eff);width:0%;transition:width .2s}
.ffmpeg-overlay{top:0;transform:translateX(-50%);left:50%;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:10000;backdrop-filter:blur(6px);padding:20px;transform:none}
.ffmpeg-overlay.show{display:flex}
.ffmpeg-box{background:#1a1a1a;border:2px solid var(--brand);border-radius:10px;padding:26px 22px;text-align:center;max-width:440px;width:100%;color:#fff;font-family:'Cairo',sans-serif}
.ffmpeg-box h3{color:var(--brand);margin-bottom:14px;font-size:16px}
.ffmpeg-box p{color:#aaa;font-size:12px;line-height:1.7;margin-bottom:14px}
.ffmpeg-box .spinner{width:44px;height:44px;border:4px solid #333;border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite;margin:12px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.ffmpeg-box button{margin-top:12px;background:#444;color:#fff;border:1px solid #555;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px;min-height:44px}

<script>
/* ============================================================
   GLOBAL ERROR / NOTIFICATIONS
   ============================================================ */
const errBanner=document.getElementById('errBanner');
const infoBanner=document.getElementById('infoBanner');
const progressBanner=document.getElementById('progressBanner');
const progressText=document.getElementById('progressText');
const progressFill=document.getElementById('progressFill');
const ffmpegOverlay=document.getElementById('ffmpegOverlay');
const ffmpegMsg=document.getElementById('ffmpegMsg');
const ffmpegCancel=document.getElementById('ffmpegCancel');
const loadingScreen=document.getElementById('loadingScreen');

function showError(m){console.error('[Hanta]',m);errBanner.textContent='⚠ '+m;errBanner.classList.add('show');setTimeout(()=>errBanner.classList.remove('show'),6000);}
function showInfo(m){infoBanner.textContent=m;infoBanner.classList.add('show');clearTimeout(showInfo._t);showInfo._t=setTimeout(()=>infoBanner.classList.remove('show'),3000);}
function showProgress(m,pct){progressBanner.classList.add('show');progressText.textContent=m;progressFill.style.width=pct+'%';}
function hideProgress(){progressBanner.classList.remove('show');}
function showFFmpeg(m){ffmpegOverlay.classList.add('show');ffmpegMsg.textContent=m;}
function hideFFmpeg(){ffmpegOverlay.classList.remove('show');}
window.addEventListener('error',e=>showError(e.message));
window.addEventListener('unhandledrejection',e=>showError('Promise: '+(e.reason?.message||e.reason)));

/* ============================================================
   DEVICE DETECTION
   ============================================================ */
const isMobile=()=>window.matchMedia('(max-width:700px)').matches;
const isTouch=()=>'ontouchstart' in window||navigator.maxTouchPoints>0;
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
const isAndroid=()=>/Android/i.test(navigator.userAgent);
const isSafari=()=>/^((?!chrome|android).)*safari/i.test(navigator.userAgent);

/* ============================================================
   HELPERS
   ============================================================ */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const LOG=(...a)=>console.log('[Hanta]',...a);
const pad2=n=>String(n).padStart(2,'0');
function tc(sec){sec=Math.max(0,sec||0);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=Math.floor(sec%60),f=Math.floor((sec%1)*30);return `${pad2(h)}:${pad2(m)}:${pad2(s)}:${pad2(f)}`;}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function uid(p){return p+Math.random().toString(36).slice(2,9);}

/* ============================================================
   MOBILE PANEL SWITCHING
   ============================================================ */
function switchMobilePanel(name){
  const panels={
    project:document.getElementById('projectPanel'),
    monitor:document.getElementById('monitorPanel'),
    effects:document.getElementById('effectsPanel')
  };
  Object.values(panels).forEach(p=>p.classList.remove('mobile-active'));
  if(panels[name])panels[name].classList.add('mobile-active');
  $$('.mobile-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mobilePanel===name));
  if(name==='monitor')setTimeout(()=>renderProgram(),50);
}
$$('.mobile-tabs button').forEach(b=>{
  b.addEventListener('click',()=>switchMobilePanel(b.dataset.mobilePanel));
});

/* ============================================================
   STATE
   ============================================================ */
const TRACKS=['T1','L1','V2','V1','A1','A2'];
const TRACK_INFO={T1:{type:'text'},L1:{type:'logo'},V2:{type:'video'},V1:{type:'video'},A1:{type:'audio'},A2:{type:'audio'}};

const TRANSITIONS=[
  {id:'none',name:'بدون'},{id:'fade',name:'تلاشي'},{id:'dissolve',name:'دمج'},
  {id:'slide-left',name:'انزلاق ←'},{id:'slide-right',name:'انزلاق →'},
  {id:'zoom',name:'تكبير'},{id:'wipe',name:'مسح'}
];
const TEXT_ANIMATIONS=[
  {id:'none',name:'بدون'},{id:'typewriter',name:'آلة كاتبة'},{id:'fade',name:'ظهور تدريجي'},
  {id:'slide-left',name:'دخول يسار'},{id:'slide-right',name:'دخول يمين'},
  {id:'slide-up',name:'دخول أسفل'},{id:'slide-down',name:'دخول أعلى'},
  {id:'zoom',name:'تكبير'},{id:'bounce',name:'نبض'},{id:'rotate',name:'دوران'}
];

const state={
  project:[],tracks:{T1:[],L1:[],V2:[],V1:[],A1:[],A2:[]},
  playhead:0,zoom:60,selection:null,selectedAsset:null,
  tool:'select',playing:false,targetTrack:'V1',
  locked:{T1:false,L1:false,V2:false,V1:false,A1:false,A2:false},
  visible:{T1:true,L1:true,V2:true,V1:true},
  muted:{A1:false,A2:false},solo:{A1:false,A2:false},
  chroma:{on:false,color:'#00ff00',tol:40},
  effects:{opacity:100,brightness:100,contrast:100,saturation:100},
  masterVideoVolume:100,masterMusicVolume:100
};

/* ============================================================
   MEDIA POOLS
   ============================================================ */
const videoPool={},audioPool={},waveformCache={};
function getVideo(src){
  if(!videoPool[src]){
    const v=document.createElement('video');
    v.src=src;v.preload='auto';v.playsInline=true;v.muted=false;
    if(isIOS())v.setAttribute('playsinline','');
    videoPool[src]=v;hookAudio(v,'video');
  }
  return videoPool[src];
}
function getAudio(src){
  if(!audioPool[src]){
    const a=document.createElement('audio');
    a.src=src;a.preload='auto';a.loop=false;
    audioPool[src]=a;hookAudio(a,'music');
  }
  return audioPool[src];
}
const imageCache={};
function getImage(src){if(!imageCache[src]){const i=new Image();i.src=src;imageCache[src]=i;}return imageCache[src];}

/* ============================================================
   WAVEFORMS
   ============================================================ */
async function computeWaveform(src,peaks=180){
  if(waveformCache[src])return waveformCache[src];
  try{
    const resp=await fetch(src);
    const buf=await resp.arrayBuffer();
    const actx=new (window.AudioContext||window.webkitAudioContext)();
    const decoded=await actx.decodeAudioData(buf.slice(0));
    actx.close();
    const data=decoded.getChannelData(0);
    const block=Math.floor(data.length/peaks);
    const result=[];
    for(let i=0;i<peaks;i++){
      let max=0;const start=i*block;const end=Math.min(start+block,data.length);
      for(let j=start;j<end;j+=4){const v=Math.abs(data[j]);if(v>max)max=v;}
      result.push(max);
    }
    waveformCache[src]=result;return result;
  }catch(e){console.warn('waveform fail',e);return null;}
}
function drawWaveform(canvas,peaks,color='#a8e6b8',reverse=false){
  if(!peaks)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  ctx.clearRect(0,0,W,H);
  const midY=H/2;
  ctx.strokeStyle=color;ctx.lineWidth=1;
  ctx.beginPath();
  const step=W/peaks.length;
  for(let i=0;i<peaks.length;i++){
    const x=i*step;
    const idx=reverse?(peaks.length-1-i):i;
    const amp=(peaks[idx]||0)*midY*0.9;
    ctx.moveTo(x,midY-amp);ctx.lineTo(x,midY+amp);
  }
  ctx.stroke();
}

/* ============================================================
   AUDIO GRAPH
   ============================================================ */
let audioCtx=null,videoGain=null,musicGain=null,exportDest=null;
const hookedElements=new WeakSet();
function ensureAudioGraph(){
  if(audioCtx)return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    videoGain=audioCtx.createGain();
    musicGain=audioCtx.createGain();
    exportDest=audioCtx.createMediaStreamDestination();
    videoGain.connect(audioCtx.destination);videoGain.connect(exportDest);
    musicGain.connect(audioCtx.destination);musicGain.connect(exportDest);
    videoGain.gain.value=state.masterVideoVolume/100;
    musicGain.gain.value=state.masterMusicVolume/100;
    Object.values(videoPool).forEach(v=>hookAudio(v,'video'));
    Object.values(audioPool).forEach(a=>hookAudio(a,'music'));
  }catch(e){console.warn('audio graph failed',e);}
}
function hookAudio(el,kind){
  if(!audioCtx||hookedElements.has(el))return;
  try{
    const src=audioCtx.createMediaElementSource(el);
    const gain=kind==='video'?videoGain:musicGain;
    src.connect(gain);hookedElements.add(el);
  }catch(e){}
}

/* ============================================================
   FONTS
   ============================================================ */
const ARABIC_FONTS=[
  {id:'Cairo',name:'القاهرة'},{id:'Tajawal',name:'تجوال'},
  {id:'El Messiri',name:'المسيري'},{id:'Changa',name:'شنغا'},
  {id:'Amiri',name:'أميري'},{id:'Almarai',name:'المراعي'}
];
const ENGLISH_FONTS=[
  {id:'Roboto',name:'Roboto'},{id:'Montserrat',name:'Montserrat'},
  {id:'Poppins',name:'Poppins'},{id:'Oswald',name:'Oswald'},{id:'Bebas Neue',name:'Bebas Neue'}
];

/* ============================================================
   IMPORT
   ============================================================ */
function detectKind(file){
  if(file.type&&file.type.startsWith('video/'))return 'video';
  if(file.type&&file.type.startsWith('audio/'))return 'audio';
  if(file.type&&file.type.startsWith('image/'))return 'image';
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(['mp4','webm','mov','mkv','avi','m4v','ogv','3gp'].includes(ext))return 'video';
  if(['mp3','wav','ogg','m4a','aac','flac'].includes(ext))return 'audio';
  if(['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext))return 'image';
  return null;
}
function probeVideo(src){return new Promise(res=>{
  const v=document.createElement('video');v.preload='metadata';v.muted=true;v.playsInline=true;
  let done=false;const fin=(d,t)=>{if(done)return;done=true;clearTimeout(timer);res({duration:d||5,thumb:t||null});};
  const timer=setTimeout(()=>fin(5,null),8000);
  v.onloadedmetadata=()=>{const dur=(isFinite(v.duration)&&v.duration>0)?v.duration:5;
    try{v.currentTime=Math.min(0.5,dur/2);}catch(_){fin(dur,null);}
    setTimeout(()=>fin(dur,null),2000);};
  v.onseeked=()=>{try{const c=document.createElement('canvas');c.width=80;c.height=45;
    c.getContext('2d').drawImage(v,0,0,80,45);fin(v.duration||5,c.toDataURL('image/jpeg',.6));}catch(_){fin(v.duration||5,null);}};
  v.onerror=()=>fin(5,null);v.src=src;
});}
function probeAudio(src){return new Promise(res=>{
  const a=document.createElement('audio');a.preload='metadata';let done=false;
  const fin=d=>{if(done)return;done=true;clearTimeout(t);res(d||5);};
  const t=setTimeout(()=>fin(5),5000);
  a.onloadedmetadata=()=>fin(a.duration);a.onerror=()=>fin(5);a.src=src;
});}
async function importFiles(files){
  if(!files||!files.length)return;
  for(const f of files){
    const kind=detectKind(f);
    if(!kind){showError('صيغة غير مدعومة: '+f.name);continue;}
    const src=URL.createObjectURL(f);
    const asset={id:uid('a_'),name:f.name,src,kind,duration:5,thumb:null,status:'loading'};
    if(kind==='image'){asset.duration=5;asset.thumb=src;asset.status='ready';}
    else if(kind==='video'){const{duration,thumb}=await probeVideo(src);asset.duration=duration;asset.thumb=thumb;asset.status='ready';}
    else{asset.duration=await probeAudio(src);asset.status='ready';
      computeWaveform(src).then(()=>{renderTimeline();});}
    state.project.push(asset);renderProject();updateStatus();
  }
  showInfo(`✅ تم استيراد ${files.length} ملف`);
}

/* ============================================================
   PROJECT PANEL
   ============================================================ */
function renderProject(){
  const list=$('#projList');list.innerHTML='';
  if(!state.project.length){
    list.innerHTML=`<div class="empty-hint">لم يتم استيراد ملفات بعد<br><br>اضغط <b>استيراد</b> أعلاه<br><br><span style="font-size:10px;color:#555">MP4, WebM, MOV, JPG, PNG, MP3</span></div>`;
    return;
  }
  state.project.forEach(a=>{
    const row=document.createElement('div');
    row.className='proj-item'+(state.selectedAsset===a.id?' selected':'');
    const icon=a.kind==='audio'?'♫':a.kind==='image'?'🖼':'🎬';
    row.innerHTML=`<div class="proj-thumb">${a.thumb?`<img src="${a.thumb}">`:icon}</div>
      <div class="proj-name" title="${a.name}">${a.name}</div>
      <div class="proj-dur">${a.status==='loading'?'…':tc(a.duration)}</div>`;
    row.addEventListener('click',()=>{
      state.selectedAsset=a.id;state.selection=null;
      renderProject();renderEffectControls();updateStatus();
    });
    row.addEventListener('dblclick',()=>addAssetToTimeline(a));
    // Mobile: single tap on thumbnail adds to timeline, single tap elsewhere selects
    if(isTouch()){
      let lastTap=0;
      row.addEventListener('touchend',e=>{
        const now=Date.now();
        if(now-lastTap<300){e.preventDefault();addAssetToTimeline(a);}
        lastTap=now;
      });
    }
    list.appendChild(row);
  });
}

/* ============================================================
   ADD ASSET / TEXT / LOGO
   ============================================================ */
function resolveTargetTrack(asset){
  const sel=$('#targetTrackSelect').value;
  if(sel!=='auto'){
    const t=TRACK_INFO[sel];
    const ok=(asset.kind==='audio'&&t.type==='audio')||(asset.kind!=='audio'&&t.type==='video');
    if(ok)return sel;
  }
  if(state.targetTrack){
    const t=TRACK_INFO[state.targetTrack];
    const ok=(asset.kind==='audio'&&t.type==='audio')||(asset.kind!=='audio'&&t.type==='video');
    if(ok)return state.targetTrack;
  }
  if(asset.kind==='audio')return state.tracks.A1.length<=state.tracks.A2.length?'A1':'A2';
  return state.tracks.V1.length<=state.tracks.V2.length?'V1':'V2';
}
function addAssetToTimeline(asset){
  if(!asset){showError('اختر ملفًا من Project أولاً');return;}
  const trackName=resolveTargetTrack(asset);
  const lane=state.tracks[trackName];
  const start=lane.reduce((m,c)=>Math.max(m,c.start+c.duration),0);
  const srcDur=asset.duration||5;
  const clip={id:uid('c_'),assetId:asset.id,name:asset.name,src:asset.src,
    kind:asset.kind,type:asset.kind,track:trackName,start,duration:srcDur,
    sourceDuration:srcDur,speed:1.0,reverse:false,volume:100,
    transIn:{type:'none',duration:0.5},transOut:{type:'none',duration:0.5}};
  lane.push(clip);state.selection=clip.id;
  state.targetTrack=trackName;
  $('#targetLabel').textContent=trackName;
  showInfo(`✅ أضيف إلى ${trackName}`);
  renderTimeline();renderProgram();renderEffectControls();updateStatus();
  if(isMobile())switchMobilePanel('monitor');
}
function addTextClip(){
  const clip={id:uid('t_'),type:'text',track:'T1',name:'نص جديد',
    start:state.playhead,duration:5,text:'جمعية حنطة الخيرية التنموية',
    fontFamily:'Cairo',fontSize:36,color:'#ffffff',bold:true,shadow:true,x:320,y:300,
    animation:{type:'none',duration:0.8}};

}
function addLogoClip(src,img){

  const clip={id:uid('l_'),type:'logo',track:'L1',name:'لوغو',
    start:state.playhead,duration:5,src,img,x:480,y:20,width,height:Math.round(width/aspect),opacity:100,

/* ============================================================
   SPLIT
   ============================================================ */
function splitAtPlayhead(){
  let targetClip=null,targetTrack=null;
  if(state.selection){for(const t of TRACKS){const c=state.tracks[t].find(x=>x.id===state.selection);if(c){targetClip=c;targetTrack=t;break;}}}
  if(!targetClip){const lane=state.tracks[state.targetTrack]||[];targetClip=lane.find(c=>state.playhead>c.start+0.05&&state.playhead<c.start+c.duration-0.05);if(targetClip)targetTrack=state.targetTrack;}
  if(!targetClip){for(const t of TRACKS){const c=state.tracks[t].find(x=>state.playhead>x.start+0.05&&state.playhead<x.start+x.duration-0.05);if(c){targetClip=c;targetTrack=t;break;}}}
  if(!targetClip){showError('لا يوجد مقطع تحت خط التشغيل');return;}
  const lt=state.playhead-targetClip.start;
  if(lt<=0.05||lt>=targetClip.duration-0.05){showError('المؤشر عند حافة المقطع');return;}
  const prefix=targetClip.type==='text'?'t_':targetClip.type==='logo'?'l_':'c_';
  const first={...targetClip,duration:lt};
  const second={...targetClip,id:uid(prefix),start:state.playhead,duration:targetClip.duration-lt};
  const lane=state.tracks[targetTrack];const i=lane.findIndex(c=>c.id===targetClip.id);
  lane.splice(i,1,first,second);state.selection=second.id;
  showInfo(`✂ تم التقطيع`);
  renderTimeline();renderProgram();renderEffectControls();updateStatus();
}
$('#splitBtn').addEventListener('click',splitAtPlayhead);

/* ============================================================
   TIMELINE RENDER
   ============================================================ */
function renderTimeline(){
  const thCol=$('#thCol');thCol.innerHTML='<div class="th-spacer"></div>';
  TRACKS.forEach(name=>{
    const info=TRACK_INFO[name];const h=document.createElement('div');
    h.className='th '+info.type+(state.targetTrack===name?' target':'');h.dataset.track=name;
    const eye=(info.type==='video'||info.type==='text'||info.type==='logo')
      ?`<button class="mini-btn ${state.visible[name]?'on':''}" data-act="eye" data-t="${name}" type="button">👁</button>`:'';
    const lock=`<button class="mini-btn ${state.locked[name]?'on':''}" data-act="lock" data-t="${name}" type="button">🔒</button>`;
    const mute=info.type==='audio'?`<button class="mini-btn ${state.muted[name]?'mute-on':''}" data-act="mute" data-t="${name}" type="button">M</button>`:'';
    const solo=info.type==='audio'?`<button class="mini-btn ${state.solo[name]?'on':''}" data-act="solo" data-t="${name}" type="button">S</button>`:'';
    h.innerHTML=`<span class="name">${name}</span><span class="spacer"></span>${eye}${lock}${mute}${solo}`;
    thCol.appendChild(h);
  });
  thCol.querySelectorAll('.mini-btn').forEach(b=>{
    b.addEventListener('click',ev=>{
      ev.stopPropagation();const{act,t}=b.dataset;
      if(act==='eye')state.visible[t]=!state.visible[t];
      if(act==='lock')state.locked[t]=!state.locked[t];
      if(act==='mute')state.muted[t]=!state.muted[t];
      if(act==='solo')state.solo[t]=!state.solo[t];
      renderTimeline();renderProgram();
    });
  });
  thCol.querySelectorAll('.th').forEach(h=>{
    h.addEventListener('click',()=>{
      state.targetTrack=h.dataset.track;
      $('#targetLabel').textContent=h.dataset.track;
      renderTimeline();
    });
  });

  renderRuler();
  const tracks=$('#tracks');tracks.innerHTML='';
  TRACKS.forEach(name=>{
    const info=TRACK_INFO[name];const lane=document.createElement('div');
    lane.className='lane '+info.type+(state.targetTrack===name?' target':'');lane.dataset.track=name;
    if(state.locked[name])lane.classList.add('locked');
    state.tracks[name].forEach(clip=>{
      const el=document.createElement('div');
      el.className='clip '+info.type;el.dataset.id=clip.id;el.dataset.track=name;
      if(clip.reverse)el.classList.add('rev');
      el.style.left=(clip.start*state.zoom)+'px';
      el.style.width=Math.max(10,clip.duration*state.zoom)+'px';
      if(state.selection===clip.id)el.classList.add('selected');
      const animBadge=clip.animation&&clip.animation.type!=='none'
        ?`<span class="anim-badge">✨</span>`:'';
      const transBadge=clip.transIn&&clip.transIn.type!=='none'
        ?`<span class="trans-badge">⇄</span>`:'';
      const speedBadge=(clip.speed&&clip.speed!==1)
        ?`<span class="trans-badge" style="background:#22a85c;color:#fff">${clip.speed.toFixed(1)}x</span>`:'';
      const reverseBadge=clip.reverse
        ?`<span class="trans-badge" style="background:var(--reverse);color:#fff">🔄</span>`:'';
      let dn=clip.name;
      if(clip.type==='text')dn='📝 '+clip.text.slice(0,15);
      else if(clip.type==='logo')dn='🖼';
      else if(info.type==='audio')dn='♫';
      else dn=clip.name.slice(0,15);
      el.innerHTML=`<div class="clip-name"><span class="track-badge">${name}</span>${dn}${transBadge}${speedBadge}${reverseBadge}${animBadge}</div>
        <div class="strip">${info.type==='audio'?'<canvas class="waveform-canvas"></canvas>':''}</div>`;
      bindClipEvents(el,clip,name);
      lane.appendChild(el);
    });
    // Transition markers
    if(info.type==='video'){
      const sorted=state.tracks[name].slice().sort((a,b)=>a.start-b.start);
      for(let i=0;i<sorted.length-1;i++){
        const a=sorted[i],b=sorted[i+1];
        const gap=b.start-(a.start+a.duration);
        if(Math.abs(gap)<0.05){
          const marker=document.createElement('div');
          const transType=a.transOut&&a.transOut.type!=='none'?a.transOut.type:(b.transIn&&b.transIn.type!=='none'?b.transIn.type:'none');
          marker.className='transition-marker'+(transType==='none'?' empty':'');
          marker.style.left=((a.start+a.duration)*state.zoom-13)+'px';
          marker.textContent=transType==='none'?'+':'⇄';
          marker.addEventListener('click',(e)=>{e.stopPropagation();
            state.selection=a.id;state.targetTrack=name;$('#targetLabel').textContent=name;
            renderTimeline();renderEffectControls();
            if(isMobile())switchMobilePanel('effects');
            showInfo('💡 عدّل الانتقال من الخصائص');});
          lane.appendChild(marker);
        }
      }
    }
    // Drop support for desktop
    lane.addEventListener('dragover',e=>e.preventDefault());
    lane.addEventListener('drop',e=>{
      e.preventDefault();
      if(!state.selectedAsset)return;
      const a=state.project.find(x=>x.id===state.selectedAsset);if(!a)return;
      const ok=(a.kind==='audio'&&info.type==='audio')||(a.kind!=='audio'&&info.type==='video');
      if(!ok){showError(`لا يمكن وضع ${a.kind} في مسار ${info.type}`);return;}
      const rect=tracks.getBoundingClientRect();const start=Math.max(0,(e.clientX-rect.left)/state.zoom);
      const sd=a.duration||5;
      state.tracks[name].push({id:uid('c_'),assetId:a.id,name:a.name,src:a.src,kind:a.kind,type:a.kind,
        track:name,start,duration:sd,sourceDuration:sd,speed:1.0,reverse:false,volume:100,
        transIn:{type:'none',duration:0.5},transOut:{type:'none',duration:0.5}});
      renderTimeline();renderProgram();updateStatus();
    });
    tracks.appendChild(lane);
  });
  updatePlayhead();updateTC();
  // Draw waveforms
  requestAnimationFrame(()=>{
    state.tracks.A1.concat(state.tracks.A2).forEach(clip=>{
      const el=tracks.querySelector(`.clip[data-id="${clip.id}"] canvas`);
      if(el){
        const rect=el.parentElement.getBoundingClientRect();
        el.width=rect.width;el.height=rect.height;
        const peaks=waveformCache[clip.src];
        if(peaks)drawWaveform(el,peaks,clip.track==='A1'?'#a8e6b8':'#7ad4a0',clip.reverse);
        else computeWaveform(clip.src).then(p=>{if(p)drawWaveform(el,p,'#a8e6b8',clip.reverse);});
      }
    });
  });
}

function renderRuler(){
  const ruler=$('#ruler');const w=Math.max(state.zoom*60+400,3000);
  ruler.style.width=w+'px';ruler.innerHTML='';
  const step=state.zoom>=80?1:state.zoom>=40?2:state.zoom>=20?5:10;
  const loops=Math.floor(w/state.zoom/step);
  for(let i=0;i<=loops;i++){const s=i*step;const t=document.createElement('div');
    t.className='tick'+(s%(step*5)===0?' major':'');t.style.left=(s*state.zoom)+'px';
    if(s%(step*5)===0)t.textContent=tc(s);ruler.appendChild(t);}
}

/* ============================================================
   CLIP DRAG (POINTER EVENTS — mouse + touch unified)
   ============================================================ */
let activeDrag=null;
function onPointerDownClip(e,clip,trackName){
  if(state.locked[trackName])return;
  e.preventDefault();e.stopPropagation();
  state.selection=clip.id;state.targetTrack=trackName;
  $('#targetLabel').textContent=trackName;
  const isTouchEvent=e.pointerType==='touch';
  activeDrag={
    clip,startX:e.clientX,startY:e.clientY,
    origStart:clip.start,
    isTouch:isTouchEvent,
    longPressTimer:null,
    dragging:false
  };
  renderTimeline();renderEffectControls();
  // Long press on mobile to select only (defer drag)
  if(isTouchEvent){
    activeDrag.longPressTimer=setTimeout(()=>{
      if(activeDrag&&!activeDrag.dragging){
        activeDrag.dragging=true;
        document.body.style.cursor='grabbing';
        if(navigator.vibrate)navigator.vibrate(30);
      }
    },200);
  }else{
    activeDrag.dragging=true;
    document.body.style.cursor='grabbing';
  }
}
document.addEventListener('pointermove',e=>{
  if(!activeDrag)return;
  const dx=e.clientX-activeDrag.startX;
  if(!activeDrag.dragging){
    // Not yet dragging (mobile waiting for long press threshold)
    if(Math.abs(dx)>8){
      clearTimeout(activeDrag.longPressTimer);
      activeDrag.dragging=true;
      if(navigator.vibrate)navigator.vibrate(20);
    }
  }
  if(activeDrag.dragging){
    e.preventDefault();
    const newStart=Math.max(0,activeDrag.origStart+dx/state.zoom);
    activeDrag.clip.start=newStart;
    renderTimeline();updateStatus();
  }
},{passive:false});
document.addEventListener('pointerup',()=>{
  if(activeDrag){
    if(activeDrag.longPressTimer)clearTimeout(activeDrag.longPressTimer);
    activeDrag=null;document.body.style.cursor='';
  }
});
document.addEventListener('pointercancel',()=>{
  if(activeDrag){
    if(activeDrag.longPressTimer)clearTimeout(activeDrag.longPressTimer);
    activeDrag=null;document.body.style.cursor='';
  }
});
function bindClipEvents(el,clip,trackName){
  el.addEventListener('pointerdown',e=>onPointerDownClip(e,clip,trackName));
}

/* ============================================================
   RULER SCRUB (POINTER EVENTS)
   ============================================================ */
const ruler=$('#ruler');
let scrubbing=false;
ruler.addEventListener('pointerdown',e=>{
  e.preventDefault();
  scrubbing=true;
  ruler.setPointerCapture(e.pointerId);
  const rect=ruler.getBoundingClientRect();
  seekToPx(e.clientX-rect.left);
});
ruler.addEventListener('pointermove',e=>{
  if(!scrubbing)return;
  e.preventDefault();
  const rect=ruler.getBoundingClientRect();
  seekToPx(e.clientX-rect.left);
});
ruler.addEventListener('pointerup',()=>{scrubbing=false;});
ruler.addEventListener('pointercancel',()=>{scrubbing=false;});
window.addEventListener('pointermove',e=>{
  if(!scrubbing)return;
  const rect=ruler.getBoundingClientRect();
  seekToPx(e.clientX-rect.left);
});
window.addEventListener('pointerup',()=>{scrubbing=false;});

function seekToPx(px){
  state.playhead=Math.max(0,px/state.zoom);
  updatePlayhead();updateTC();renderProgram();syncAudioPlayback();updateStatus();
}
function updatePlayhead(){$('#playhead').style.left=(state.playhead*state.zoom)+'px';}
function updateTC(){$('#progTC').textContent=tc(state.playhead);}

   TOOLS
   ============================================================ */
function setTool(t){
  state.tool=t;
  $$('.tool-btn[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
}
$$('.tool-btn[data-tool]').forEach(b=>b.addEventListener('click',()=>setTool(b.dataset.tool)));
$('#addTextBtn').addEventListener('click',addTextClip);
$('#addLogoBtn').addEventListener('click',()=>$('#logoFileInput').click());
$('#logoFileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();const url=URL.createObjectURL(f);
  img.onload=()=>addLogoClip(url,img);img.src=url;e.target.value='';
});
$('#skipStart').addEventListener('click',()=>{
  state.playhead=0;updatePlayhead();updateTC();renderProgram();syncAudioPlayback();updateStatus();
});

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='v'||e.key==='V')setTool('select');
  if(e.key==='h'||e.key==='H')setTool('hand');
  if(e.key==='t'||e.key==='T'){e.preventDefault();addTextClip();}
  if(e.key===' '){e.preventDefault();togglePlay();}
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K'||e.key==='b'||e.key==='B')){e.preventDefault();splitAtPlayhead();}
  if(e.key==='Delete'&&state.selection){
    TRACKS.forEach(n=>state.tracks[n]=state.tracks[n].filter(c=>c.id!==state.selection));
    state.selection=null;renderTimeline();renderProgram();renderEffectControls();updateStatus();
  }
});

$('#zoomRange').addEventListener('input',e=>{state.zoom=+e.target.value;renderTimeline();});

/* ============================================================
   EFFECT CONTROLS
   ============================================================ */

  if(!state.selection)return null;
  for(const t of TRACKS){const c=state.tracks[t].find(x=>x.id===state.selection);if(c)return c;}
  return null;
}

          <input type="range" class="vol-music" id="masterMusicVol" min="0" max="200" value="${state.masterMusicVolume}">

  });

    state.masterMusicVolume=+e.target.value;
    $('#masterMusicVal').textContent=e.target.value+'%';

  if(sel&&sel.type==='text')bindTextControls(sel);

  if(sel&&sel.kind==='audio')bindAudioControls(sel);
  if(sel&&(sel.kind==='video'||sel.kind==='image'))bindVideoControls(sel);

/* ---- VIDEO ---- */
function renderVideoControls(clip){
  const transIn=clip.transIn||{type:'none',duration:0.5};
  const transOut=clip.transOut||{type:'none',duration:0.5};
  const inButtons=TRANSITIONS.map(t=>`<button data-trans="in" data-type="${t.id}" class="${transIn.type===t.id?'active':''}" type="button">${t.name}</button>`).join('');

  const sp=clip.speed||1;
  const srcDur=clip.sourceDuration||clip.duration;
  const speedPresets=[0.25,0.5,1,1.5,2,3].map(s=>`<button data-speed="${s}" type="button" class="${Math.abs(sp-s)<0.01?'active':''}">${s}x</button>`).join('');
  return `
    <div class="eff-item"><div class="eff-title">الشفافية</div>
      <div class="eff-ctrl"><div class="eff-row"><label>Opacity</label>
        <input type="range" id="effOpacity" min="0" max="100" value="${state.effects.opacity}">
        <span class="val" id="effOpacityVal">${state.effects.opacity}%</span></div></div>
    </div>
    <div class="eff-item"><div class="eff-title">تصحيح الألوان</div>
      <div class="eff-ctrl">

/* ============================================================
   PROGRAM MONITOR
   ============================================================ */
const progCanvas=$('#programCanvas');
const progCtx=progCanvas.getContext('2d');
const chromaCanvas=document.createElement('canvas');
const chromaCtx=chromaCanvas.getContext('2d',{willReadFrequently:true});

function getActiveClips(trackName){
  return state.tracks[trackName].filter(c=>state.playhead>=c.start&&state.playhead<=c.start+c.duration);
}
function getActiveVideoClipsIncludingTransitions(trackName){
  const all=state.tracks[trackName];
  return all.filter(c=>{
    if(state.playhead>=c.start&&state.playhead<=c.start+c.duration)return true;
    if(c.reverse&&state.playhead>=c.start-0.1&&state.playhead<=c.start+c.duration+0.1)return true;
    const tin=c.transIn||{type:'none',duration:0};
    const tout=c.transOut||{type:'none',duration:0};
    if(tin.type!=='none'&&state.playhead>=c.start-tin.duration&&state.playhead<c.start)return true;
    if(tout.type!=='none'&&state.playhead>c.start+c.duration&&state.playhead<=c.start+c.duration+tout.duration)return true;
    return false;
  });
}
function drawVideoClipToCanvas(targetCtx,W,H,clip){
  if(clip.kind==='image'){
    const img=getImage(clip.src);
    if(img.complete)drawContain(targetCtx,img,W,H);
    else img.onload=()=>drawContain(targetCtx,img,W,H);
  }else if(clip.kind==='video'){
    const v=getVideo(clip.src);
    const speed=clip.speed||1;
    const srcDur=clip.sourceDuration||clip.duration;
    const elapsed=state.playhead-clip.start;
    let local=clip.reverse?(srcDur-(elapsed*speed)):(elapsed*speed);
    if(v.readyState>=1){
      const target=clamp(local,0,srcDur);
      const threshold=clip.reverse?0.08:0.15;
      if(Math.abs(v.currentTime-target)>threshold){try{v.currentTime=target;}catch(_){}}
    }
    if(v.readyState>=2){
      if(state.chroma.on)drawWithChroma(targetCtx,v,W,H);
      else drawContain(targetCtx,v,W,H);
    }
  }
}
function renderProgram(){
  const W=progCanvas.width,H=progCanvas.height;
  progCtx.fillStyle='#000';progCtx.fillRect(0,0,W,H);

  progCtx.save();
  const fx=state.effects;
  progCtx.globalAlpha=fx.opacity/100;
  progCtx.filter=`brightness(${fx.brightness}%) contrast(${fx.contrast}%) saturate(${fx.saturation}%)`;

  const layers=[];
  if(state.visible.V1)layers.push({name:'V1',z:1});
  if(state.visible.V2)layers.push({name:'V2',z:2});
  layers.sort((a,b)=>a.z-b.z);

  layers.forEach(layer=>{
    const clips=getActiveVideoClipsIncludingTransitions(layer.name);
    clips.forEach(clip=>{
      const transIn=clip.transIn||{type:'none',duration:0};
      const transOut=clip.transOut||{type:'none',duration:0};
      const clipEnd=clip.start+clip.duration;
      if(transIn.type!=='none'&&state.playhead<clip.start&&state.playhead>=clip.start-transIn.duration){
        const p=clamp((state.playhead-(clip.start-transIn.duration))/transIn.duration,0,1);
        drawTransition(progCtx,W,H,clip,transIn.type,p,true);
      }else if(transOut.type!=='none'&&state.playhead>clipEnd&&state.playhead<=clipEnd+transOut.duration){
        const p=clamp((state.playhead-clipEnd)/transOut.duration,0,1);
        drawTransition(progCtx,W,H,clip,transOut.type,p,false);
      }else if(state.playhead>=clip.start&&state.playhead<=clipEnd){
        drawVideoClipToCanvas(progCtx,W,H,clip);
      }
    });
  });
  progCtx.restore();

  if(state.visible.L1){
    getActiveClips('L1').forEach(clip=>{
      const img=clip.img||getImage(clip.src);
      const draw=()=>{
        const anim=getAnimState(clip,state.playhead);
        progCtx.save();
        progCtx.globalAlpha=((clip.opacity??100)/100)*anim.opacity;
        progCtx.translate(clip.x+clip.width/2,clip.y+clip.height/2);
        progCtx.translate(anim.offsetX,anim.offsetY);
        progCtx.scale(anim.scale,anim.scale);
        progCtx.drawImage(img,-clip.width/2,-clip.height/2,clip.width,clip.height);
        progCtx.restore();
      };
      if(img.complete)draw();else img.onload=draw;
    });
  }
  if(state.visible.T1){
    getActiveClips('T1').forEach(clip=>{
      const anim=getAnimState(clip,state.playhead);
      let text=clip.text;
      if(clip.animation&&clip.animation.type==='typewriter'){
        const elapsed=state.playhead-clip.start;
        const chars=Math.floor((elapsed/clip.animation.duration)*text.length);
        text=text.slice(0,clamp(chars,0,text.length));
      }
      progCtx.save();
      progCtx.font=`${clip.bold?'bold':'normal'} ${clip.fontSize}px ${clip.fontFamily}, Tahoma`;
      progCtx.textAlign='center';progCtx.textBaseline='middle';
      if(clip.shadow){progCtx.shadowColor='rgba(0,0,0,.85)';progCtx.shadowBlur=10;progCtx.shadowOffsetX=2;progCtx.shadowOffsetY=2;}
      progCtx.globalAlpha=anim.opacity;
      progCtx.translate(clip.x+anim.offsetX,clip.y+anim.offsetY);
      progCtx.scale(anim.scale,anim.scale);
      progCtx.rotate(anim.rotation);
      progCtx.fillStyle=clip.color;
      progCtx.fillText(text,0,0);
      if(state.selection===clip.id){
        const w=progCtx.measureText(text).width;
        progCtx.strokeStyle='#ffcc00';progCtx.lineWidth=2;progCtx.setLineDash([6,4]);
        progCtx.shadowColor='transparent';
        progCtx.strokeRect(-w/2-8,-clip.fontSize/2-6,w+16,clip.fontSize+12);
      }
      progCtx.restore();
    });
  }
}
function drawTransition(ctx,W,H,clip,type,p,entering){
  const alpha=entering?p:1-p;
  ctx.save();
  ctx.globalAlpha*=alpha;
  if(type==='fade'||type==='dissolve'){
    drawVideoClipToCanvas(ctx,W,H,clip);
  }else if(type==='slide-left'){
    const offset=entering?(1-p)*W:-p*W;
    ctx.translate(offset,0);drawVideoClipToCanvas(ctx,W,H,clip);
  }else if(type==='slide-right'){
    const offset=entering?-(1-p)*W:p*W;
    ctx.translate(offset,0);drawVideoClipToCanvas(ctx,W,H,clip);
  }else if(type==='zoom'){
    const scale=entering?0.3+p*0.7:1-(1-p)*0.7;
    ctx.translate(W/2,H/2);ctx.scale(scale,scale);ctx.translate(-W/2,-H/2);
    drawVideoClipToCanvas(ctx,W,H,clip);
  }else if(type==='wipe'){
    const w=W*p;
    ctx.beginPath();
    if(entering){ctx.rect(0,0,w,H);}else{ctx.rect(0,0,W*(1-p),H);}
    ctx.clip();drawVideoClipToCanvas(ctx,W,H,clip);
  }else{drawVideoClipToCanvas(ctx,W,H,clip);}
  ctx.restore();
}
function getAnimState(clip,time){
  const s={opacity:1,offsetX:0,offsetY:0,scale:1,rotation:0};
  const anim=clip.animation;
  if(!anim||anim.type==='none')return s;
  const elapsed=time-clip.start;
  const dur=anim.duration||0.8;
  if(elapsed<0||elapsed>dur)return s;
  const p=clamp(elapsed/dur,0,1);
  const ease=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  switch(anim.type){
    case 'typewriter': s.opacity=1; break;
    case 'fade': s.opacity=ease; break;
    case 'slide-left': s.offsetX=-200*(1-ease); s.opacity=ease; break;
    case 'slide-right': s.offsetX=200*(1-ease); s.opacity=ease; break;
    case 'slide-up': s.offsetY=150*(1-ease); s.opacity=ease; break;
    case 'slide-down': s.offsetY=-150*(1-ease); s.opacity=ease; break;
    case 'zoom': s.scale=0.3+ease*0.7; s.opacity=ease; break;
    case 'bounce': s.scale=1+Math.sin(p*Math.PI*2)*0.15*(1-p); s.opacity=Math.min(1,p*3); break;
    case 'rotate': s.rotation=(1-ease)*-Math.PI*2; s.scale=0.3+ease*0.7; s.opacity=ease; break;
  }
  return s;
}
function drawContain(ctx,src,W,H){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  const sw=src.videoWidth||src.width,sh=src.videoHeight||src.height;
  if(!sw||!sh)return;
  const r=Math.min(W/sw,H/sh);const w=sw*r,h=sh*r;
  ctx.drawImage(src,(W-w)/2,(H-h)/2,w,h);
}
function drawWithChroma(ctx,video,W,H){
  chromaCanvas.width=W;chromaCanvas.height=H;
  chromaCtx.drawImage(video,0,0,W,H);
  const frame=chromaCtx.getImageData(0,0,W,H);const d=frame.data;
  const kr=parseInt(state.chroma.color.slice(1,3),16),kg=parseInt(state.chroma.color.slice(3,5),16),kb=parseInt(state.chroma.color.slice(5,7),16);
  const tol=state.chroma.tol*2.55,tol2=tol*tol;
  for(let i=0;i<d.length;i+=4){
    const dr=d[i]-kr,dg=d[i+1]-kg,db=d[i+2]-kb;
    if(dr*dr+dg*dg+db*db<tol2)d[i+3]=0;
  }
  chromaCtx.putImageData(frame,0,0);
  ctx.drawImage(chromaCanvas,0,0,W,H);
}

let canvasDrag=null;
progCanvas.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const rect=progCanvas.getBoundingClientRect();
  const sx=progCanvas.width/rect.width,sy=progCanvas.height/rect.height;
  const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
  if(state.visible.T1){
    const ts=getActiveClips('T1').slice().reverse();
    for(const t of ts){
      progCtx.save();
      progCtx.font=`${t.bold?'bold':'normal'} ${t.fontSize}px ${t.fontFamily}, Tahoma`;
      const w=progCtx.measureText(t.text).width;
      progCtx.restore();
      if(mx>=t.x-w/2-8&&mx<=t.x+w/2+8&&my>=t.y-t.fontSize/2-6&&my<=t.y+t.fontSize/2+6){
        canvasDrag={type:'text',clip:t,offX:mx-t.x,offY:my-t.y};
        state.selection=t.id;state.targetTrack='T1';$('#targetLabel').textContent='T1';
        renderTimeline();renderEffectControls();
        if(isMobile())switchMobilePanel('effects');
        progCanvas.setPointerCapture(e.pointerId);
        return;
      }
    }
  }
  if(state.visible.L1){
    const ls=getActiveClips('L1').slice().reverse();
    for(const l of ls){
      if(mx>=l.x&&mx<=l.x+l.width&&my>=l.y&&my<=l.y+l.height){
        canvasDrag={type:'logo',clip:l,offX:mx-l.x,offY:my-l.y};
        state.selection=l.id;state.targetTrack='L1';$('#targetLabel').textContent='L1';
        renderTimeline();renderEffectControls();
        if(isMobile())switchMobilePanel('effects');
        progCanvas.setPointerCapture(e.pointerId);
        return;
      }
    }
  }
});
progCanvas.addEventListener('pointermove',e=>{
  if(!canvasDrag)return;
  e.preventDefault();
  const rect=progCanvas.getBoundingClientRect();
  const sx=progCanvas.width/rect.width,sy=progCanvas.height/rect.height;
  const mx=(e.clientX-rect.left)*sx,my=(e.clientY-rect.top)*sy;
  canvasDrag.clip.x=Math.round(mx-canvasDrag.offX);
  canvasDrag.clip.y=Math.round(my-canvasDrag.offY);
  renderProgram();
  if(canvasDrag.type==='text'){
    const x=$('#txtX'),y=$('#txtY');
    if(x){x.value=canvasDrag.clip.x;$('#txtXVal').textContent=canvasDrag.clip.x;}
    if(y){y.value=canvasDrag.clip.y;$('#txtYVal').textContent=canvasDrag.clip.y;}
  }else{
    const x=$('#lgoX'),y=$('#lgoY');
    if(x){x.value=canvasDrag.clip.x;$('#lgoXVal').textContent=canvasDrag.clip.x;}
    if(y){y.value=canvasDrag.clip.y;$('#lgoYVal').textContent=canvasDrag.clip.y;}
  }
});
progCanvas.addEventListener('pointerup',()=>{canvasDrag=null;});
progCanvas.addEventListener('pointercancel',()=>{canvasDrag=null;});

/* ============================================================
   AUDIO PLAYBACK SYNC
   ============================================================ */
function syncAudioPlayback(){
  TRACKS.filter(t=>TRACK_INFO[t].type==='video').forEach(trackName=>{
    state.tracks[trackName].forEach(clip=>{
      if(clip.kind!=='video')return;
      const v=getVideo(clip.src);
      const isActive=state.playhead>=clip.start&&state.playhead<=clip.start+clip.duration;
      const isMain=trackName==='V1';
      v.muted=!isMain||state.muted[trackName];
      const speed=clip.speed||1;
      const elapsed=state.playhead-clip.start;
      const reverse=clip.reverse===true;
      if(reverse){
        if(!v.paused){try{v.pause();}catch(_){}}
        return;
      }
      const local=elapsed*speed;
      const targetRate=clamp(speed,0.25,4);
      if(Math.abs(v.playbackRate-targetRate)>0.01)v.playbackRate=targetRate;
      if(isActive){
        if(Math.abs(v.currentTime-local)>0.25){try{v.currentTime=local;}catch(_){}}
        if(state.playing&&v.paused)v.play().catch(()=>{});
        if(!state.playing&&!v.paused)v.pause();
      }else{if(!v.paused)v.pause();}
    });
  });
  TRACKS.filter(t=>TRACK_INFO[t].type==='audio').forEach(trackName=>{
    state.tracks[trackName].forEach(clip=>{
      const a=getAudio(clip.src);
      a.volume=Math.min(1,(clip.volume??100)/100);
      a.muted=state.muted[trackName];
      const speed=clip.speed||1;
      const srcDur=clip.sourceDuration||clip.duration;
      const elapsed=state.playhead-clip.start;
      const isActive=state.playhead>=clip.start&&state.playhead<=clip.start+clip.duration;
      if(clip.reverse){
        const reverseLocal=srcDur-(elapsed*speed);
        if(isActive){
          const target=clamp(reverseLocal,0,srcDur);
          if(Math.abs(a.currentTime-target)>0.12){try{a.currentTime=target;}catch(_){}}
          if(state.playing&&a.paused)a.play().catch(()=>{});
          if(!state.playing&&!a.paused)a.pause();
        }else{if(!a.paused)a.pause();}
        return;
      }
      const targetRate=clamp(speed,0.25,4);
      if(Math.abs(a.playbackRate-targetRate)>0.01)a.playbackRate=targetRate;
      const local=elapsed*speed;
      if(isActive){
        if(Math.abs(a.currentTime-local)>0.25){try{a.currentTime=local;}catch(_){}}
        if(state.playing&&a.paused)a.play().catch(()=>{});
        if(!state.playing&&!a.paused)a.pause();
      }else{if(!a.paused)a.pause();}
    });
  });
}

/* ============================================================
   PLAYBACK
   ============================================================ */
let rafId=null,lastT=0;
function togglePlay(){
  ensureAudioGraph();
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  state.playing=!state.playing;
  $('#progPlay').textContent=state.playing?'⏸':'▶';
  if(state.playing){
    syncAudioPlayback();
    lastT=performance.now();
    rafId=requestAnimationFrame(loop);
    if(isMobile())switchMobilePanel('monitor');
  }else{
    Object.values(videoPool).forEach(v=>v.pause());
    Object.values(audioPool).forEach(a=>a.pause());
    if(rafId)cancelAnimationFrame(rafId);
  }
}
function loop(t){
  if(!state.playing)return;
  const dt=(t-lastT)/1000;lastT=t;
  state.playhead+=dt;
  updatePlayhead();updateTC();renderProgram();syncAudioPlayback();updateStatus();
  const maxEnd=TRACKS.flatMap(n=>state.tracks[n].map(c=>c.start+c.duration)).reduce((a,b)=>Math.max(a,b),0);
  if(maxEnd&&state.playhead>=maxEnd){togglePlay();return;}
  rafId=requestAnimationFrame(loop);
}
$('#progPlay').addEventListener('click',togglePlay);

async function recordToWebM(onProgress){
  const totalDuration=TRACKS.flatMap(n=>state.tracks[n].map(c=>c.start+c.duration)).reduce((a,b)=>Math.max(a,b),0);
  if(!totalDuration)throw new Error('لا توجد مقاطع');

  ensureAudioGraph();
  if(audioCtx&&audioCtx.state==='suspended')await audioCtx.resume();

  state.playhead=0;updatePlayhead();updateTC();syncAudioPlayback();

  const FPS=isMobile()?24:30;
  const stream=progCanvas.captureStream(FPS);
  if(exportDest){
    try{exportDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));}catch(_){}
  }
  let mime='video/webm;codecs=vp9,opus';
  if(!MediaRecorder.isTypeSupported(mime))mime='video/webm;codecs=vp8,opus';
  if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';
  const rec=new MediaRecorder(stream,{
    mimeType:mime,
    videoBitsPerSecond:isMobile()?2_500_000:4_000_000,
    audioBitsPerSecond:128_000
  });
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};

  return new Promise((resolve,reject)=>{
    rec.onstop=()=>resolve(new Blob(chunks,{type:'video/webm'}));
    rec.onerror=e=>reject(e.error||new Error('MediaRecorder error'));

    state.playing=true;$('#progPlay').textContent='⏸';
    lastT=performance.now();syncAudioPlayback();
    rafId=requestAnimationFrame(loop);
    rec.start(200);

    const startWall=performance.now();
    const timer=setInterval(()=>{
      const elapsed=(performance.now()-startWall)/1000;
      const pct=Math.min(100,(elapsed/totalDuration)*100);
      onProgress(pct);
    },150);

    setTimeout(()=>{
      clearInterval(timer);
      state.playing=false;$('#progPlay').textContent='▶';
      if(rafId)cancelAnimationFrame(rafId);
      Object.values(videoPool).forEach(v=>v.pause());
      Object.values(audioPool).forEach(a=>a.pause());
      rec.stop();
    },(totalDuration*1000)+500);
  });
}

async function convertToMP4(webmBlob,onProgress){
  const {createFFmpeg,fetchFile}=FFmpeg;
  const ffmpeg=createFFmpeg({
    log:false,
    corePath:'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
  });
  ffmpeg.setProgress(({ratio})=>{if(ratio>=0)onProgress(Math.round(ratio*100));});
  await ffmpeg.load();
  ffmpeg.FS('writeFile','input.webm',await fetchFile(webmBlob));
  await ffmpeg.run('-i','input.webm','-c:v','libx264','-preset','ultrafast','-crf','26','-c:a','aac','-b:a','128k','output.mp4');
  const data=ffmpeg.FS('readFile','output.mp4');
  return new Blob([data.buffer],{type:'video/mp4'});
}

async function exportFinalProject(){
  const totalDuration=TRACKS.flatMap(n=>state.tracks[n].map(c=>c.start+c.duration)).reduce((a,b)=>Math.max(a,b),0);
  if(!totalDuration){showError('أضف مقاطع أولاً');return;}
  
  // ffmpeg MP4 only works on desktop with SharedArrayBuffer
  const canMP4=!isMobile()&&typeof SharedArrayBuffer!=='undefined'&&window.crossOriginIsolated;
  
  let wantMP4=false;
  if(canMP4){
    const choice=confirm(`سيتم تصدير فيديو مدته ${tc(totalDuration)}.\n\nاضغط OK لتصدير MP4\nأو Cancel لتصدير WebM سريعًا`);
    wantMP4=choice;
  }else{
    const msg=isMobile()
      ?`سيتم تصدير فيديو مدته ${tc(totalDuration)} بصيغة WebM.\n\nملاحظة: الجوال لا يدعم تحويل MP4 مباشرة. الملف الناتج يعمل على VLC ويوتيوب.\n\nهل تريد المتابعة؟`
      :`سيتم تصدير فيديو مدته ${tc(totalDuration)} بصيغة WebM.\n\n(بيئة العمل لا تسمح بتحويل MP4)`;
    if(!confirm(msg))return;
  }

  try{
    showProgress('جاري تسجيل الفيديو…',0);
    const webmBlob=await recordToWebM(pct=>showProgress(`جاري التسجيل… ${Math.round(pct)}%`,pct));

    if(wantMP4){
      hideProgress();
      showFFmpeg('جاري تحميل المحوّل…');
      let cancelled=false;
      ffmpegCancel.onclick=()=>{cancelled=true;hideFFmpeg();};
      try{
        const mp4Blob=await convertToMP4(webmBlob,pct=>{
          if(!cancelled)ffmpegMsg.textContent=`جاري تحويل MP4… ${pct}%`;
        });
        if(cancelled)return;
        hideFFmpeg();
        downloadBlob(mp4Blob,'mp4');
        showInfo('✅ تم التصدير بصيغة MP4');
      }catch(err){
        hideFFmpeg();
        console.warn('MP4 convert failed',err);
        downloadBlob(webmBlob,'webm');
        showInfo('⚠ فشل MP4 — تم تنزيل WebM');
      }
    }else{
      hideProgress();
      downloadBlob(webmBlob,'webm');
      showInfo('✅ تم التصدير');
    }
  }catch(e){
    hideProgress();hideFFmpeg();
    showError('فشل التصدير: '+e.message);
  }
}

function downloadBlob(blob,ext){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`Hanta_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.${ext}`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}

  },800);

  LOG('ready ✓ — جرّب: ＋ نص، ＋ لوغو، تصدير');
  if(isMobile())showInfo('📱 استخدم التبويبات أعلاه للتنقل بين الملفات والمعاينة والخصائص');
}
document.readyState==='loading'
  ? document.addEventListener('DOMContentLoaded',init)
  : init();
</script>
